<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - 门店看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; background: #f5f7fa; min-height: 100vh; }

/* Login */
#adminLogin {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  display: flex; align-items: center; justify-content: center; z-index: 999;
}
.login-card { background: #fff; border-radius: 12px; padding: 40px 36px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
.login-card h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 4px; }
.login-card .sub { font-size: 13px; color: #999; margin-bottom: 28px; }
.login-card input { width: 100%; padding: 12px 14px; margin-bottom: 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; }
.login-card input:focus { border-color: #1890ff; }
.login-card button { width: 100%; padding: 12px; background: #1890ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.login-card button:hover { background: #1677cc; }
.login-card button:disabled { background: #91caff; cursor: not-allowed; }
#loginError { color: #ff4d4f; font-size: 13px; margin-top: 12px; min-height: 20px; }

/* Admin Panel */
#adminPanel { display: none; max-width: 1100px; margin: 0 auto; padding: 24px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.header h1 { font-size: 20px; color: #1a1a2e; }
.header .right { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #666; }
.header .logout { background: none; border: 1px solid #ddd; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #666; }
.header .logout:hover { color: #ff4d4f; border-color: #ff4d4f; }

/* Add Form */
.add-form { background: #fff; border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.add-form h3 { font-size: 15px; color: #333; margin-bottom: 14px; }
.add-form .fields { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
.add-form input, .add-form select { padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; outline: none; }
.add-form input:focus { border-color: #1890ff; }
.add-form .btn-add { padding: 10px 24px; background: #1890ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.add-form .btn-add:hover { background: #1677cc; }
.add-form .btn-add:disabled { background: #91caff; cursor: not-allowed; }
.add-form .add-msg { grid-column: 1 / -1; font-size: 13px; min-height: 18px; }

/* User Table */
.table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); overflow: hidden; }
.table-wrap .tbar { padding: 14px 24px; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #999; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 24px; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
th { background: #fafafa; color: #666; font-weight: 600; white-space: nowrap; }
td .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
td .badge.admin { background: #fff1f0; color: #ff4d4f; }
td .badge.user { background: #f6ffed; color: #52c41a; }
td .actions { display: flex; gap: 8px; }
td .actions button { padding: 4px 12px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fff; font-size: 12px; cursor: pointer; color: #666; }
td .actions button:hover { border-color: #1890ff; color: #1890ff; }
td .actions button.danger:hover { border-color: #ff4d4f; color: #ff4d4f; }
.empty { text-align: center; color: #ccc; padding: 40px; font-size: 14px; }
/* Toast */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 24px; background: #333; color: #fff; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.success { background: #52c41a; }
.toast.error { background: #ff4d4f; }
</style>
</head>
<body>

<!-- Admin Login -->
<div id="adminLogin">
  <div class="login-card">
    <h1>管理员登录</h1>
    <p class="sub">仅限管理员访问</p>
    <input type="tel" id="phone" placeholder="手机号" maxlength="11" autocomplete="tel">
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" onclick="doAdminLogin()">管理员登录</button>
    <p id="loginError"></p>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel">
  <div class="header">
    <h1>用户管理</h1>
    <div class="right">
      管理员：<strong id="adminName">--</strong>
      <button class="logout" onclick="doLogout()">退出</button>
    </div>
  </div>

  <!-- Add User -->
  <div class="add-form"><h3>用户名单说明</h3><p style="font-size:13px;color:#999;">用户名单已内嵌在本页面（离线模式，不再依赖云端后端）。如需新增、删除用户或重置密码，请联系维护者更新名单。</p></div>

  <!-- User Table -->
  <div class="table-wrap">
    <div class="tbar">共 <strong id="userCount">0</strong> 个用户</div>
    <table>
      <thead><tr><th>姓名</th><th>手机号</th><th>角色</th><th>所属</th></tr></thead>
      <tbody id="userTableBody"><tr><td colspan="4" class="empty">加载中...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 本地登录（已内嵌用户名单，不再依赖 Supabase 后端） =====
var DEFAULT_PASSWORD = '123456';
var ADMIN_PHONES = ['13581922077'];
var LOCAL_USERS = [
  { phone: '18600550550', name: '石芃', role: '总部经理' },
  { phone: '13581922077', name: '周顺锴', role: '总部' },
  { phone: '15081280260', name: '侯兴宇', role: '总部' },
  { phone: '13810895583', name: '程帅威', role: '总部' },
  { phone: '18001371339', name: '陈秋', role: '总部' },
  { phone: '13321162717', name: '洪登峰', role: '总部' },
  { phone: '18510074022', name: '范晓明', role: '稽核员' },
  { phone: '18511548473', name: '梁永超', role: '稽核员' },
  { phone: '15028501136', name: '钱磊', role: '稽核员' },
  { phone: '18943199770', name: '马昕茹', role: '稽核员' },
  { phone: '17731680088', name: '张炜玉', role: '稽核员' },
  { phone: '15035983112', name: '乔雨地', role: '稽核员' },
  { phone: '18631430763', name: '陶畅', role: '稽核员' },
  { phone: '15810446139', name: '王红丽', role: '稽核员' },
  { phone: '13283356328', name: '徐瑞雪', role: '稽核员' },
  { phone: '13473141654', name: '刘畅', role: '客服' },
  { phone: '18600593162', name: '胡柯翊', role: '营运' },
  { phone: '13910048738', name: '李万鹏', role: '营运' },
  { phone: '13131460667', name: '李鹏', role: '营运' },
  { phone: '18001191162', name: '高珧', role: '营运' },
  { phone: '13641027314', name: '杨贺川', role: '营运' },
  { phone: '18398139493', name: '赵芳', role: '营运' },
  { phone: '15378780520', name: '李伟', role: '营运' },
  { phone: '15711052421', name: '田凯迪', role: '营运' },
  { phone: '16567892666', name: '赵斌', role: '营运' },
  { phone: '15046683023', name: '梁烁', role: '营运' },
  { phone: '17600274225', name: '李塘龙', role: '营运' },
  { phone: '13812293745', name: '闫海青', role: '营运' },
  { phone: '17778011272', name: '陈贵安', role: '营运' }
];

function findUser(phone) {
  for (var i = 0; i < LOCAL_USERS.length; i++) { if (LOCAL_USERS[i].phone === phone) return LOCAL_USERS[i]; }
  return null;
}

function showToast(msg, type) {
  var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + (type || '') + ' show';
  setTimeout(function() { t.className = 'toast'; }, 2500);
}

document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doAdminLogin(); });

function doAdminLogin() {
  var phone = document.getElementById('phone').value.trim();
  var pw = document.getElementById('password').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  if (!phone || !pw) { err.textContent = '请输入手机号和密码'; return; }
  if (!/^1\d{10}$/.test(phone)) { err.textContent = '请输入正确的手机号'; return; }
  btn.disabled = true; btn.textContent = '验证中...'; err.textContent = '';

  var u = findUser(phone);
  if (!u) { err.textContent = '账号不存在'; btn.disabled = false; btn.textContent = '管理员登录'; return; }
  if (ADMIN_PHONES.indexOf(phone) === -1) { err.textContent = '非管理员账号，无权访问'; btn.disabled = false; btn.textContent = '管理员登录'; return; }
  if (pw !== DEFAULT_PASSWORD) { err.textContent = '密码错误'; btn.disabled = false; btn.textContent = '管理员登录'; return; }

  document.getElementById('adminLogin').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('adminName').textContent = u.name;
  btn.disabled = false; btn.textContent = '管理员登录';
  loadUsers();
}

function doLogout() {
  document.getElementById('adminLogin').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('phone').value = '';
  document.getElementById('password').value = '';
  document.getElementById('loginError').textContent = '';
}

function loadUsers() {
  document.getElementById('userCount').textContent = LOCAL_USERS.length;
  var html = '';
  LOCAL_USERS.forEach(function(u) {
    html += '<tr><td>' + u.name + '</td><td>' + u.phone + '</td><td>'
      + (ADMIN_PHONES.indexOf(u.phone) > -1 ? '<span class="badge admin">管理员</span>' : '<span class="badge user">' + u.role + '</span>')
      + '</td><td>' + u.role + '</td></tr>';
  });
  document.getElementById('userTableBody').innerHTML = html || '<tr><td colspan="4" class="empty">暂无用户</td></tr>';
}
</script>
</body>
</html>
