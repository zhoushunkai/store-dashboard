<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>处罚统计看板 - 员工维度</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;padding:20px 32px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.header h1{font-size:22px;font-weight:600;margin-bottom:4px}
.header .sub{font-size:13px;opacity:.8}

.container{max-width:1400px;margin:0 auto;padding:20px 24px}

/* Year Tabs */
.year-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.year-tab{padding:8px 24px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;border:2px solid #e0e0e0;background:#fff;color:#666;transition:all .2s;user-select:none}
.year-tab:hover{border-color:#16213e;color:#16213e}
.year-tab.active{background:#16213e;color:#fff;border-color:#16213e}

/* Month Tabs */
.month-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.month-tab{padding:10px 28px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;border:2px solid #e0e0e0;background:#fff;color:#666;transition:all .2s;user-select:none}
.month-tab:hover{border-color:#0f3460;color:#0f3460}
.month-tab.active{background:#0f3460;color:#fff;border-color:#0f3460}

/* Summary Cards */
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.summary-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid #0f3460}
.summary-card.warn{border-left-color:#e74c3c}
.summary-card.good{border-left-color:#27ae60}
.summary-card.info{border-left-color:#3498db}
.summary-card .label{font-size:13px;color:#888;margin-bottom:6px}
.summary-card .value{font-size:28px;font-weight:700;color:#1a1a2e}
.summary-card .unit{font-size:14px;color:#888;font-weight:400}

/* Filters */
.filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;background:#fff;padding:16px 20px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.filter-bar label{font-size:13px;color:#666;font-weight:500;white-space:nowrap}
.filter-bar select,.filter-bar input{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;min-width:140px;transition:border .2s}
.filter-bar select:focus,.filter-bar input:focus{border-color:#0f3460}
.filter-bar input[type="text"]{min-width:220px;flex:1;max-width:360px}
.search-wrap{position:relative;flex:1;max-width:360px}
.search-wrap input{padding-left:32px;width:100%}
.search-wrap::before{content:'\1F50D';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px}
.btn-reset{padding:8px 16px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#666;cursor:pointer;font-size:13px;transition:all .2s}
.btn-reset:hover{background:#f0f0f0}
.btn-export{padding:8px 16px;border:none;border-radius:6px;background:#0f3460;color:#fff;cursor:pointer;font-size:13px;transition:all .2s}
.btn-export:hover{background:#1a4a8a}

/* Charts */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chart-card h3{font-size:15px;font-weight:600;margin-bottom:16px;color:#1a1a2e}
.chart-wrap{position:relative;height:300px}
.chart-wrap canvas{max-height:300px}

/* Tables */
.section-title{font-size:16px;font-weight:600;color:#1a1a2e;margin:24px 0 12px;padding-left:12px;border-left:3px solid #0f3460}
.data-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:13px}
.data-table th{background:#1a1a2e;color:#fff;padding:12px 14px;text-align:left;font-weight:500;white-space:nowrap}
.data-table td{padding:10px 14px;border-bottom:1px solid #f0f0f0}
.data-table tr:hover{background:#f8f9fe}
.data-table .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge-level3{background:#fde8e8;color:#c0392b}
.badge-level2{background:#fef3e2;color:#e67e22}
.badge-level1{background:#e8f4fd;color:#2980b9}
.badge-fine{background:#f0f0f0;color:#666}
.badge-reward{background:#e8f8e8;color:#27ae60}

.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.pagination button{padding:8px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;transition:all .2s}
.pagination button:hover:not(:disabled){background:#0f3460;color:#fff;border-color:#0f3460}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:#888}

/* Person Summary */
.person-summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.person-card{background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;border:1px solid transparent}
.person-card:hover{border-color:#0f3460;transform:translateY(-1px)}
.person-card .p-name{font-size:15px;font-weight:600;color:#1a1a2e;margin-bottom:6px}
.person-card .p-info{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#888}
.person-card .p-info span{background:#f5f6fa;padding:2px 8px;border-radius:4px}
.person-card .p-stats{display:flex;gap:16px;margin-top:8px;font-size:13px}
.person-card .p-stat{display:flex;flex-direction:column}
.person-card .p-stat .n{font-size:18px;font-weight:700}
.person-card .p-stat .n.red{color:#e74c3c}
.person-card .p-stat .n.orange{color:#e67e22}
.person-card .p-stat .l{font-size:11px;color:#999}

.empty-state{text-align:center;padding:60px 20px;color:#999;font-size:15px}
.loading{text-align:center;padding:40px;color:#888}

/* Unmatched persons section */
.unmatched-section{margin-bottom:20px;padding:16px 20px;background:#fffbe6;border:1px solid #f0d060;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.unmatched-section h3{font-size:15px;font-weight:600;color:#8a6d14;margin-bottom:10px}
.unmatched-section .unmatched-grid{display:flex;flex-wrap:wrap;gap:10px}
.unmatched-section .unmatched-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:#fef9e7;border:1px solid #f0d060;border-radius:16px;font-size:13px;color:#6e5900}
.unmatched-section .unmatched-tag .store-num{font-size:11px;color:#999;background:#f5f0d0;padding:1px 6px;border-radius:8px}

@media(max-width:768px){
  .charts-row{grid-template-columns:1fr}
  .summary-row{grid-template-columns:repeat(2,1fr)}
  .filter-bar{flex-direction:column;align-items:stretch}
}
</style>
</head>

  <div class="sub">以员工及工号为主要维度 | 数据来源：2026.6-2026.7mavis.xlsx</div>

<div class="container">

  <!-- Person Summary Grid -->

  <div class="person-summary-row" id="personGrid"></div>

  <div class="section-title">处罚明细</div>

      </tr></thead>
      <tbody id="detailBody"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

var PUNISH_DATA_LOADED = true;
// ─── Data Loading ───
let ALL_DATA = null;
let currentYear = '2026';
let currentMonth = '6月';
let currentPage = 1;
const PAGE_SIZE = 25;
const LOAD_TIMEOUT = 15000;
let filteredData = [];
const yearDataCache = {};
let loadAbortController = null;

function showLoading(msg) {
  document.getElementById('personGrid').innerHTML = `<div class="loading">${msg || '数据加载中...'}</div>`;
  document.getElementById('detailBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#999">加载中...</td></tr>';
}

function showLoadError(year, msg) {
  document.getElementById('personGrid').innerHTML = `<div class="empty-state">${year}年数据加载失败：${msg}</div>`;
  document.getElementById('detailBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#999">加载失败</td></tr>';
}

function fetchYearData(year) {
  const data = EMBEDDED_PUNISH_DATA;
  const yearRecords = data.punishments.filter(r => getYear(r) === year);
  return { punishments: yearRecords, source: 'embedded' };
}

function loadData() {
  showLoading('正在加载 2026 年处罚数据...');
  try {
    const data = fetchYearData('2026');
    ALL_DATA = data;
    yearDataCache['2026'] = data;
    initFilters();
    switchYear('2026');
    loadPersonData();
  } catch(e) {
    document.getElementById('personGrid').innerHTML = '<div class="empty-state">数据加载失败：' + e.message + '</div>';
  }
}

// ─── Unmatched Persons (data_person vs data_punish) ───
async function loadPersonData() {
  try {
    const resp = await fetch('data_person.json');
    const personData = await resp.json();
    renderUnmatchedPersons(personData);
  } catch(e) {
    console.log('data_person.json 加载失败:', e.message);
  }
}

function renderUnmatchedPersons(personData) {
  const punishNames = new Set(ALL_DATA.punishments.map(r => r.name));
  const unmatched = [];

  for (const p of personData) {
    const name = p.person;
    const baseName = name.split('（')[0].split('(')[0].trim();
    if (!punishNames.has(baseName)) {
      let existing = unmatched.find(u => u.name === baseName);
      if (existing) {
        existing.stores.push(p.store_num);
      } else {
        unmatched.push({ name: baseName, stores: [p.store_num] });
      }
    }
  }

  if (unmatched.length === 0) {
    document.getElementById('unmatchedSection').style.display = 'none';
    return;
  }

  unmatched.sort((a, b) => a.name.localeCompare(b.name, 'zh'));

  document.getElementById('unmatchedSection').style.display = 'block';
  document.getElementById('unmatchedGrid').innerHTML = unmatched.map(u =>
    `<div class="unmatched-tag">
      <strong>${u.name}</strong>
      <span class="store-num">门店 ${u.stores.join(', ')}</span>
    </div>`
  ).join('');
}

// ─── Derive Year from date ───
function getYear(record) {
  if (!record.date) return '';
  const y = record.date.substring(0, 4);
  return y;
}

// ─── Year Switching ───
function switchYear(year) {
  currentYear = year;
  currentPage = 1;

  document.querySelectorAll('.year-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.year === year);
  });

  // Check cache, load if needed
  if (!yearDataCache[year]) {
    showLoading(`正在加载 ${year} 年处罚数据...`);
    try {
      yearDataCache[year] = fetchYearData(year);
    } catch(e) {
      showLoadError(year, e.message);
      document.getElementById('monthTabs').innerHTML = '';
      document.getElementById('summaryCards').innerHTML = '';
      return;
    }
  }

  ALL_DATA = yearDataCache[year];

  // Build month tabs
  const yearData = ALL_DATA.punishments;
  const monthsInYear = [...new Set(yearData.map(r => r.month).filter(Boolean))].sort((a, b) => {
    return parseInt(a) - parseInt(b);
  });

  const monthTabsEl = document.getElementById('monthTabs');
  if (monthsInYear.length === 0) {
    monthTabsEl.innerHTML = '';
    currentMonth = 'all';
    filteredData = [];
    renderEmptyState(year);
    return;
  }

  let tabsHTML = monthsInYear.map(m => 
    `<div class="month-tab" data-month="${m}">${m}</div>`
  ).join('');
  tabsHTML += `<div class="month-tab" data-month="all">累计汇总</div>`;
  monthTabsEl.innerHTML = tabsHTML;

  const availableMonths = monthsInYear.concat(['all']);
  if (!availableMonths.includes(currentMonth)) {
    currentMonth = monthsInYear[0];
  }

  document.querySelectorAll('.month-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.month === currentMonth);
  });

  applyMonthFilter();
}

function renderEmptyState(year) {
  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card"><div class="label">总处罚记录</div><div class="value">0<span class="unit">条</span></div></div>
    <div class="summary-card"><div class="label">总罚款金额</div><div class="value">0<span class="unit">元</span></div></div>
    <div class="summary-card"><div class="label">三级-降职降薪</div><div class="value">0<span class="unit">条</span></div></div>
    <div class="summary-card"><div class="label">二级-书面警告</div><div class="value">0<span class="unit">条</span></div></div>
    <div class="summary-card"><div class="label">一级-批评教育</div><div class="value">0<span class="unit">条</span></div></div>
    <div class="summary-card"><div class="label">经济处罚</div><div class="value">0<span class="unit">条</span></div></div>
  `;

  if (chartClassInst) chartClassInst.destroy();
  if (chartPosInst) chartPosInst.destroy();
  chartClassInst = null; chartPosInst = null;

  document.getElementById('personGrid').innerHTML = `<div class="empty-state">${year}年暂无处罚数据</div>`;
  document.getElementById('detailBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#999">暂无数据</td></tr>';
  document.getElementById('pagination').innerHTML = '';
  document.getElementById('personTitle').textContent = `员工处罚汇总 (${year}年)`;
}

function applyMonthFilter() {
  // Get year-filtered base data
  const yearData = ALL_DATA.punishments.filter(r => getYear(r) === currentYear);

  let data;
  if (currentMonth === 'all') {
    data = yearData;
  } else {
    data = yearData.filter(r => r.month === currentMonth);
  }

  // Apply user filters
  const searchText = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
  const filterClass = document.getElementById('filterClass')?.value || '';
  const filterPosition = document.getElementById('filterPosition')?.value || '';

  filteredData = data.filter(r => {
    if (searchText && !r.name.toLowerCase().includes(searchText) && !r.employeeId.includes(searchText)) return false;
    if (filterClass && r.classification !== filterClass) return false;
    if (filterPosition && r.position !== filterPosition) return false;
    return true;
  });

  renderSummary();
  renderCharts();
  renderPersonGrid();
  renderDetailTable();
  updatePersonTitle();
}

// ─── Month Switching (called from month tab clicks) ───
function switchMonth(month) {
  currentMonth = month;
  currentPage = 1;

  document.querySelectorAll('.month-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.month === month);
  });

  applyMonthFilter();
}

// ─── Initialize Filters ───
function initFilters() {
  const allPunish = ALL_DATA.punishments;

  const classes = [...new Set(allPunish.map(r => r.classification))].sort();
  const classSelect = document.getElementById('filterClass');
  classSelect.innerHTML = '<option value="">全部</option>';
  classes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    classSelect.appendChild(opt);
  });

  const positions = [...new Set(allPunish.map(r => r.position))].sort();
  const posSelect = document.getElementById('filterPosition');
  posSelect.innerHTML = '<option value="">全部</option>';
  positions.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    posSelect.appendChild(opt);
  });
}

// ─── Summary ───
function renderSummary() {

  const fineCount = filteredData.filter(r => r.classification === '经济处罚').length;

    <div class="summary-card warn"><div class="label">三级-降职降薪</div><div class="value">${level3Count}<span class="unit">条</span></div></div>
    <div class="summary-card warn"><div class="label">二级-书面警告</div><div class="value">${level2Count}<span class="unit">条</span></div></div>
    <div class="summary-card info"><div class="label">一级-批评教育</div><div class="value">${level1Count}<span class="unit">条</span></div></div>
    <div class="summary-card"><div class="label">经济处罚</div><div class="value">${fineCount}<span class="unit">条</span></div></div>
  `;
}

// ─── Charts ───
let chartClassInst = null, chartPosInst = null;

function renderCharts() {
  if (filteredData.length === 0) {
    if (chartClassInst) { chartClassInst.destroy(); chartClassInst = null; }
    if (chartPosInst) { chartPosInst.destroy(); chartPosInst = null; }
    return;
  }

  // Classification chart
  const classMap = {};
  filteredData.forEach(r => {
    classMap[r.classification] = (classMap[r.classification] || 0) + 1;
  });

  const classLabels = Object.keys(classMap);
  const classValues = Object.values(classMap);
  const classColors = classLabels.map(l => {
    if (l.includes('三级')) return '#e74c3c';
    if (l.includes('二级')) return '#e67e22';
    if (l.includes('一级')) return '#3498db';
    return '#95a5a6';
  });

  if (chartClassInst) chartClassInst.destroy();
  const ctx1 = document.getElementById('chartClass').getContext('2d');
  chartClassInst = new Chart(ctx1, {
    type: 'doughnut',
    data: {
      labels: classLabels,
      datasets: [{data: classValues, backgroundColor: classColors, borderWidth: 0}]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {position: 'right', labels: {font: {size: 12}, padding: 16}}}
    }
  });

  // Position chart - top 15
  const posMap = {};
  filteredData.forEach(r => {
    posMap[r.position] = (posMap[r.position] || 0) + 1;
  });
  const posSorted = Object.entries(posMap).sort((a, b) => b[1] - a[1]).slice(0, 15);

  if (chartPosInst) chartPosInst.destroy();
  const ctx2 = document.getElementById('chartPosition').getContext('2d');
  chartPosInst = new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: posSorted.map(e => e[0]),
      datasets: [{data: posSorted.map(e => e[1]), backgroundColor: '#0f3460', borderRadius: 4}]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}},
      scales: {x: {ticks: {font: {size: 11}}}, y: {ticks: {font: {size: 11}}}}
    }
  });
}

// ─── Person Grid ───
function renderPersonGrid() {
  const personMap = {};
  filteredData.forEach(r => {
    const key = r.employeeId;
    if (!personMap[key]) {
      personMap[key] = {name: r.name, employeeId: r.employeeId, position: r.position, total: 0, amount: 0, level3: 0, level2: 0, level1: 0, fine: 0, items: []};
    }
    personMap[key].total++;
    personMap[key].amount += r.amount;
    if (r.classification === '三级降职降薪') personMap[key].level3++;
    else if (r.classification === '二级书面警告') personMap[key].level2++;
    else if (r.classification === '一级批评教育') personMap[key].level1++;
    else if (r.classification === '经济处罚') personMap[key].fine++;
    personMap[key].items.push(r);
  });

  const persons = Object.values(personMap).sort((a, b) => b.total - a.total);

  const grid = document.getElementById('personGrid');
  if (persons.length === 0) {
    grid.innerHTML = '<div class="empty-state">当前筛选条件下无数据</div>';
    return;
  }

  grid.innerHTML = persons.map(p => `
    <div class="person-card" onclick="showPersonDetail('${p.employeeId}')" title="点击查看明细">
      <div class="p-name">${p.name} <span style="font-size:12px;color:#888;font-weight:400">工号: ${p.employeeId}</span></div>
      <div class="p-info">
        <span>${p.position}</span>
      </div>
      <div class="p-stats">
        <div class="p-stat"><span class="n red">${p.total}</span><span class="l">处罚次数</span></div>
        <div class="p-stat"><span class="n orange">${p.level3}</span><span class="l">三级</span></div>
        <div class="p-stat"><span class="n orange">${p.level2}</span><span class="l">二级</span></div>
        <div class="p-stat"><span class="n" style="color:#2980b9">${p.level1}</span><span class="l">一级</span></div>
        <div class="p-stat"><span class="n">${p.amount}</span><span class="l">罚款(元)</span></div>
      </div>
    </div>
  `).join('');
}

function showPersonDetail(empId) {
  document.getElementById('searchInput').value = empId;
  applyFilters();
}

// ─── Detail Table ───
function renderDetailTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageData = filteredData.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);

  const tbody = document.getElementById('detailBody');
  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#999">无匹配数据</td></tr>';
  } else {
    tbody.innerHTML = pageData.map((r, i) => {
      let badgeClass = '';
      if (r.classification === '三级降职降薪') badgeClass = 'badge-level3';
      else if (r.classification === '二级书面警告') badgeClass = 'badge-level2';
      else if (r.classification === '一级批评教育') badgeClass = 'badge-level1';
      else badgeClass = 'badge-fine';

      return `<tr>
        <td>${start + i + 1}</td>
        <td><strong>${r.name}</strong></td>
        <td>${r.employeeId}</td>
        <td>${r.position}</td>
        <td>${r.date}</td>
        <td>${r.penaltyName}</td>
        <td><span class="badge ${badgeClass}">${r.classification}</span></td>
        <td>${r.amount > 0 ? '¥' + r.amount : '-'}</td>
        <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.reason.replace(/"/g,'&quot;')}">${r.reason.substring(0,60)}${r.reason.length>60?'...':''}</td>
      </tr>`;
    }).join('');
  }

  // Pagination
  let pagHTML = '';
  pagHTML += `<button onclick="goPage(1)" ${currentPage===1?'disabled':''}>首页</button>`;
  pagHTML += `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>上一页</button>`;

  for (let p = Math.max(1, currentPage-2); p <= Math.min(totalPages, currentPage+2); p++) {
    pagHTML += `<button onclick="goPage(${p})" style="${p===currentPage?'background:#0f3460;color:#fff;border-color:#0f3460':''}">${p}</button>`;
  }

  pagHTML += `<button onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>下一页</button>`;
  pagHTML += `<button onclick="goPage(${totalPages})" ${currentPage>=totalPages?'disabled':''}>末页</button>`;
  pagHTML += `<span class="page-info">共 ${filteredData.length} 条 / ${totalPages} 页</span>`;

  document.getElementById('pagination').innerHTML = pagHTML;
}

function goPage(p) {
  const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderDetailTable();
  window.scrollTo({top: document.getElementById('detailTable').offsetTop - 100, behavior: 'smooth'});
}

function updatePersonTitle() {
  const yearLabel = currentYear + '年';
  if (currentMonth === 'all') {
    document.getElementById('personTitle').textContent = `员工处罚汇总 (${yearLabel} 累计汇总)`;
  } else {
    document.getElementById('personTitle').textContent = `员工处罚汇总 (${yearLabel} ${currentMonth})`;
  }
}

// ─── Filters ───
function applyFilters() {
  applyMonthFilter();
}

// ─── Export CSV ───
function exportCSV() {
  const headers = ['序号','姓名','工号','岗位','日期','处罚名称','处罚分类','金额','处罚原因'];
  const rows = filteredData.map((r, i) => [
    i+1, r.name, r.employeeId, r.position, r.date,
    r.penaltyName, r.classification, r.amount,
    '"' + r.reason.replace(/"/g, '""') + '"'
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const monthLabel = currentMonth === 'all' ? '累计汇总' : currentMonth;
  a.download = `处罚数据_${currentYear}年_${monthLabel}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ─── Event Listeners ───
document.getElementById('yearTabs').addEventListener('click', e => {
  if (e.target.classList.contains('year-tab')) {
    switchYear(e.target.dataset.year);
  }
});

document.getElementById('monthTabs').addEventListener('click', e => {
  if (e.target.classList.contains('month-tab')) {
    switchMonth(e.target.dataset.month);
  }
});

let filterTimeout;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(filterTimeout);
  filterTimeout = setTimeout(applyFilters, 300);
});
document.getElementById('filterClass').addEventListener('change', applyFilters);
document.getElementById('filterPosition').addEventListener('change', applyFilters);
document.getElementById('btnReset').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterClass').value = '';
  document.getElementById('filterPosition').value = '';
  applyFilters();
});
document.getElementById('btnExport').addEventListener('click', exportCSV);

// ─── Init ───
loadData();
</script>
