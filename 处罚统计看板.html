<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7月处罚统计看板（截至7.26）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f5f6fa; color: #333; line-height: 1.6;
}
.app { max-width: 1400px; margin: 0 auto; padding: 20px; }

.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; padding: 28px 32px; border-radius: 14px;
  margin-bottom: 20px; box-shadow: 0 4px 20px rgba(102,126,234,0.25);
  position: relative;
}
.header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.header .subtitle { font-size: 14px; opacity: 0.85; }
.header .share-btn {
  background: rgba(255,255,255,0.2); color: #fff;
  border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
  padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.header .share-btn:hover { background: rgba(255,255,255,0.35); }
.header-actions {
  position: absolute; top: 28px; right: 32px;
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.header-btn {
  background: rgba(255,255,255,0.15); color: #fff;
  border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
  padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.header-btn:hover { background: rgba(255,255,255,0.3); }
.header .share-btn { margin: 0; }

.summary-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px; margin-bottom: 20px;
}
.sum-card {
  background: #fff; border-radius: 12px; padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex; align-items: center; gap: 14px; transition: transform 0.2s;
}
.sum-card:hover { transform: translateY(-2px); }
.sum-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.sum-info .num { font-size: 28px; font-weight: 800; color: #1a1a2e; line-height: 1.1; }
.sum-info .label { font-size: 13px; color: #888; margin-top: 2px; }
.bg-blue { background: #e8f0fe; color: #1a73e8; }
.bg-red { background: #fce8e6; color: #d93025; }
.bg-green { background: #e6f4ea; color: #137333; }
.bg-orange { background: #fef7e0; color: #f9ab00; }
.bg-purple { background: #f3e8fd; color: #9334c6; }
.bg-teal { background: #e0f5f5; color: #00897b; }

.charts-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; margin-bottom: 20px;
}
.chart-card {
  background: #fff; border-radius: 12px; padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.chart-card h3 { font-size: 15px; font-weight: 700; color: #555; margin-bottom: 16px; }
.bar-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-label { width: 120px; font-size: 13px; text-align: right; flex-shrink: 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-label:hover { color: #667eea; text-decoration: underline; }
.bar-track { flex: 1; height: 26px; background: #f0f0f0; border-radius: 6px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 12px; font-weight: 700; color: #fff; transition: width 0.6s ease; min-width: 30px; }
.bar-count { width: 36px; font-size: 13px; font-weight: 700; text-align: left; flex-shrink: 0; }

.filter-bar {
  background: #fff; border-radius: 12px; padding: 20px 24px;
  margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.filter-section { margin-bottom: 14px; }
.filter-section:last-child { margin-bottom: 0; }
.filter-title { font-size: 13px; font-weight: 700; color: #666; margin-bottom: 8px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
  border: 1.5px solid #e0e0e0; background: #fff; color: #555; cursor: pointer;
  transition: all 0.2s; user-select: none;
}
.chip:hover { border-color: #667eea; }
.chip.active { background: #667eea; color: #fff; border-color: #667eea; }
.chip .count { font-size: 11px; opacity: 0.7; margin-left: 4px; }
.search-row { display: flex; gap: 12px; align-items: center; }
.search-input {
  flex: 1; padding: 10px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px;
  font-size: 14px; outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: #667eea; }
.select-input {
  padding: 10px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px;
  font-size: 14px; outline: none; background: #fff; cursor: pointer; min-width: 160px;
}
.select-input:focus { border-color: #667eea; }
.btn-reset {
  padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px;
  font-weight: 600; cursor: pointer; background: #f0f0f0; color: #666; transition: all 0.2s;
}
.btn-reset:hover { background: #e0e0e0; }

.view-tabs {
  display: flex; gap: 0; margin-bottom: 16px;
  background: #fff; border-radius: 12px; padding: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.view-tab {
  flex: 1; text-align: center; padding: 12px 20px; font-size: 14px; font-weight: 600;
  border-radius: 8px; cursor: pointer; transition: all 0.2s; color: #888;
}
.view-tab.active { background: #667eea; color: #fff; }
.view-tab:hover:not(.active) { background: #f0f0f0; }

/* Topic analysis */
.topic-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 16px; margin-bottom: 20px;
}
.topic-card {
  background: #fff; border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s;
}
.topic-card:hover { transform: translateY(-2px); }
.topic-header {
  padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: background 0.2s;
}
.topic-header:hover { background: #f8f9fc; }
.topic-header-left { display: flex; align-items: center; gap: 12px; }
.topic-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.topic-info .tname { font-size: 16px; font-weight: 700; color: #333; }
.topic-info .tdesc { font-size: 12px; color: #aaa; margin-top: 2px; }
.topic-count {
  font-size: 28px; font-weight: 800; color: #667eea;
}
.topic-count .unit { font-size: 13px; font-weight: 500; color: #888; margin-left: 4px; }
.topic-body { padding: 0 24px 20px; }
.topic-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.topic-row .tlabel { width: 80px; font-size: 12px; color: #888; flex-shrink: 0; text-align: right; }
.topic-row .tbar { flex: 1; height: 20px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.topic-row .tfill { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 11px; font-weight: 700; color: #fff; min-width: 24px; }
.topic-row .tnum { width: 28px; font-size: 12px; font-weight: 700; text-align: left; flex-shrink: 0; }
.topic-section-title { font-size: 12px; font-weight: 700; color: #aaa; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.topic-btn {
  margin-top: 14px; width: 100%; padding: 10px; border: none; border-radius: 8px;
  background: #667eea; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.topic-btn:hover { background: #5a6fd8; }

.store-summary-wrap {
  background: #fff; border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
}
.store-summary-wrap h3 { padding: 20px 24px 12px; font-size: 15px; font-weight: 700; color: #555; }
.store-summary-wrap .hint { padding: 0 24px 12px; font-size: 12px; color: #aaa; }
.store-summary-table { width: 100%; border-collapse: collapse; }
.store-summary-table thead th {
  background: #f8f9fc; padding: 10px 12px; text-align: left; font-size: 12px;
  font-weight: 700; color: #555; border-bottom: 2px solid #e8e8e8; white-space: nowrap;
  cursor: pointer; user-select: none;
}
.store-summary-table thead th:hover { background: #eef0f6; }
.store-summary-table tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
.store-summary-table tbody tr { cursor: pointer; transition: background 0.15s; }
.store-summary-table tbody tr:hover { background: #f8f9fc; }
.store-summary-table tbody tr.selected { background: #eef0f6; }
.num-cell { text-align: center; font-weight: 700; }
.mini-badge {
  display: inline-block; min-width: 20px; padding: 1px 5px; border-radius: 3px;
  font-size: 11px; font-weight: 700; text-align: center;
}
.mb-eco { background: #fef7e0; color: #f9ab00; }
.mb-1 { background: #e8f0fe; color: #1a73e8; }
.mb-2 { background: #fce8e6; color: #d93025; }
.mb-3 { background: #f3e8fd; color: #9334c6; }
.mb-0 { color: #ccc; }

.table-wrap {
  background: #fff; border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.table-info {
  padding: 14px 24px; font-size: 14px; color: #888;
  border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center;
}
.table-info b { color: #667eea; font-size: 16px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: #f8f9fc; padding: 12px 16px; text-align: left; font-size: 13px;
  font-weight: 700; color: #555; border-bottom: 2px solid #e8e8e8; white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead th:hover { background: #eef0f6; }
thead th .sort-icon { font-size: 10px; opacity: 0.5; margin-left: 4px; }
tbody td { padding: 10px 16px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
tbody tr:hover { background: #f8f9fc; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge-economy { background: #fef7e0; color: #f9ab00; }
.badge-level1 { background: #e8f0fe; color: #1a73e8; }
.badge-level2 { background: #fce8e6; color: #d93025; }
.badge-level3 { background: #f3e8fd; color: #9334c6; }
.badge-level4 { background: #e0f5f5; color: #00897b; }
.badge-dismiss { background: #1a1a2e; color: #fff; }
.badge-none { background: #f0f0f0; color: #999; }
.vtype-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.vtype-mgmt { background: #e8f0fe; color: #1a73e8; }
.vtype-safety { background: #fce8e6; color: #d93025; }
.vtype-op { background: #e6f4ea; color: #137333; }
.vtype-disc { background: #fef7e0; color: #f9ab00; }
.vtype-dorm { background: #f3e8fd; color: #9334c6; }
.event-cell { max-width: 280px; }
.clause-cell { max-width: 350px; color: #666; font-size: 12px; }
.truncate { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.truncate.expanded { -webkit-line-clamp: unset; }
.empty-row { text-align: center; padding: 40px; color: #999; }

.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px; }
.page-btn { padding: 6px 12px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.page-btn:hover:not(:disabled) { border-color: #667eea; background: #f8f9fc; }
.page-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
.page-btn:disabled { opacity: 0.4; cursor: default; }

.color-0 { background: linear-gradient(90deg, #667eea, #764ba2); }
.color-1 { background: linear-gradient(90deg, #f093fb, #f5576c); }
.color-2 { background: linear-gradient(90deg, #4facfe, #00f2fe); }
.color-3 { background: linear-gradient(90deg, #43e97b, #38f9d7); }
.color-4 { background: linear-gradient(90deg, #fa709a, #fee140); }
.color-5 { background: linear-gradient(90deg, #30cfd0, #330867); }
.color-6 { background: linear-gradient(90deg, #a8edea, #fed6e3); }
.color-7 { background: linear-gradient(90deg, #ff9a9e, #fecfef); }
.color-8 { background: linear-gradient(90deg, #ffecd2, #fcb69f); }
.color-9 { background: linear-gradient(90deg, #84fab0, #8fd3f4); }
.color-10 { background: linear-gradient(90deg, #cfd9df, #e2ebf0); }
.color-11 { background: linear-gradient(90deg, #f6d365, #fda085); }

@media (max-width: 768px) {
  .charts-row { grid-template-columns: 1fr; }
  .summary-row { grid-template-columns: repeat(2, 1fr); }
  .search-row { flex-direction: column; }
  .event-cell { max-width: 180px; }
  .clause-cell { max-width: 200px; }
  .header .share-btn { position: static; margin-top: 10px; }
  .header-actions { position: static; margin-top: 10px; justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>7月处罚统计看板</h1>
    <div class="subtitle" id="subtitle">数据截至 2025年7月26日 | 共 327 条记录 | 涵盖 143 家门店 | 覆盖 12 个区域</div>
    <div class="header-actions">
      <button class="header-btn" onclick="document.getElementById('excelInput').click()">&#128229; 导入Excel</button>
      <button class="header-btn" onclick="exportCSV()">&#128227; 导出CSV</button>
      <button class="header-btn" onclick="exportJSON()">&#128190; 导出JSON</button>
      <button class="header-btn" onclick="document.getElementById('jsonInput').click()">&#128229; 导入JSON</button>
      <button class="share-btn" onclick="copyShareLink()">&#128279; 分享</button>
    </div>
  </div>
  <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleExcelImport(this)">
  <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="handleJSONImport(this)">

  <div class="summary-row" id="summaryRow"></div>

  <div class="charts-row">
    <div class="chart-card"><h3>处罚类型分布</h3><div id="penaltyChart"></div></div>
    <div class="chart-card"><h3>区域处罚数量排名</h3><div id="regionChart"></div></div>
  </div>
  <div class="charts-row">
    <div class="chart-card"><h3>违纪类型分布</h3><div id="vtypeChart"></div></div>
    <div class="chart-card"><h3>处罚原因 TOP 排行</h3><div id="reasonChart"></div></div>
  </div>

  <div class="filter-bar">
    <div class="filter-section"><div class="filter-title">处罚类型</div><div class="chip-group" id="penaltyChips"></div></div>
    <div class="filter-section"><div class="filter-title">违纪类型</div><div class="chip-group" id="vtypeChips"></div></div>
    <div class="filter-section"><div class="filter-title">区域</div><div class="chip-group" id="regionChips"></div></div>
    <div class="filter-section">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索门店名称、具体事件、处罚原因...">
        <select class="select-input" id="storeSelect"><option value="">全部门店</option></select>
        <button class="btn-reset" onclick="resetFilters()">重置筛选</button>
      </div>
    </div>
  </div>

  <div class="view-tabs">
    <div class="view-tab active" onclick="switchView('detail')">&#128203; 处罚明细</div>
    <div class="view-tab" onclick="switchView('topic')">&#128269; 大单项分析</div>
    <div class="view-tab" onclick="switchView('store')">&#127978; 门店汇总</div>
  </div>

  <div id="topicView" style="display:none">
    <div class="topic-grid" id="topicGrid"></div>
  </div>

  <div id="storeView" style="display:none">
    <div class="store-summary-wrap">
      <h3>门店处罚汇总</h3>
      <div class="hint">点击任意行可在下方明细表中查看该门店的全部处罚记录 | 点击表头可排序</div>
      <table class="store-summary-table">
        <thead>
          <tr>
            <th data-ssort="store">门店</th>
            <th data-ssort="region">区域</th>
            <th data-ssort="total" style="text-align:center">处罚总数</th>
            <th style="text-align:center">经济处罚</th>
            <th style="text-align:center">一级</th>
            <th style="text-align:center">二级</th>
            <th style="text-align:center">三级</th>
            <th style="text-align:center">解除</th>
            <th style="text-align:center">未定级</th>
            <th data-ssort="fine" style="text-align:center">罚款合计</th>
          </tr>
        </thead>
        <tbody id="storeSummaryBody"></tbody>
      </table>
    </div>
  </div>

  <div id="detailView">
    <div class="table-wrap">
      <div class="table-info">
        <span>共筛选出 <b id="filteredCount">0</b> 条记录</span>
        <span id="activeFilters"></span>
      </div>
      <table id="dataTable">
        <thead>
          <tr>
            <th data-sort="seq">序号 <span class="sort-icon"></span></th>
            <th data-sort="region">区域 <span class="sort-icon"></span></th>
            <th data-sort="store">门店 <span class="sort-icon"></span></th>
            <th data-sort="date">日期 <span class="sort-icon"></span></th>
            <th>具体事件</th>
            <th>处罚原因（条款）</th>
            <th data-sort="penaltyLevel">处罚类型 <span class="sort-icon"></span></th>
            <th data-sort="violationType">违纪类型 <span class="sort-icon"></span></th>
            <th data-sort="fine">罚款 <span class="sort-icon"></span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

function calcStats(data) {
  const total = data.length;
  const stores = new Set(data.filter(d=>d.store).map(d=>d.store));
  const regions = new Set(data.filter(d=>d.region).map(d=>d.region));
  let totalFine = 0;
  data.forEach(d => { if(d.fine) totalFine += parseInt(d.fine)||0; });
  const penalized = data.filter(d=>d.penaltyLevel).length;
  return {total, stores: stores.size, regions: regions.size, totalFine, penalized};
}

  renderTable();
  if(state.view === 'store') renderStoreSummary();
  if(state.view === 'topic') renderTopics();
  // Update subtitle
  const s = calcStats(RAW_DATA);
  document.getElementById('subtitle').textContent =
    `共 ${s.total} 条记录 | 涵盖 ${s.stores} 家门店 | 覆盖 ${s.regions} 个区域 | 罚款合计 ¥${s.totalFine}`;
}

// === Import / Export ===
function excelSerialToDate(serial) {
  if(!serial || isNaN(serial)) return '';
  const base = new Date(Date.UTC(1899, 11, 30));
  const dt = new Date(base.getTime() + serial * 86400000);
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const d = String(dt.getDate()).padStart(2,'0');
  return `${m}月${d}日`;
}

function normalizePenaltyLevel(raw) {
  if(!raw) return '';
  const s = String(raw).trim();
  if(s.includes('一级') || s.includes('批评教育')) return '一级批评教育';
  if(s.includes('二级') || s.includes('书面警告')) return '二级书面警告';
  if(s.includes('三级') || s.includes('降职降薪')) return '三级降职降薪';
  if(s.includes('四级')) return '四级';
  if(s.includes('经济')) return '经济处罚';
  if(s.includes('解除')) return '解除劳动关系';
  return s;
}

function normalizeVType(raw) {
  if(!raw) return '';
  let s = String(raw).replace(/\n/g,'').replace(/\r/g,'').trim();
  s = s.replace(/类\n/g,'类').replace(/\n类/g,'类').trim();
  return s;
}

function extractFine(raw) {
  if(!raw) return '';
  const s = String(raw);
  const m = s.match(/\d+/);
  return m ? m[0] : '';
}

function handleExcelImport(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      // Find the sheet - prefer "处罚" sheet, else first
      let ws = wb.Sheets['处罚'] || wb.Sheets[wb.SheetNames[0]];
      if(!ws) { alert('未找到数据表'); return; }
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      const parsed = [];
      let seq = 0;
      // Data starts from row 4 (index 3) - skip 3 header rows
      for(let i = 3; i < rows.length; i++) {
        const r = rows[i];
        if(!r || !r[0]) continue;
        seq++;
        parsed.push({
          seq: String(seq),
          region: String(r[1]||'').trim(),
          store: String(r[2]||'').trim(),
          manager: String(r[3]||'').trim(),
          date: excelSerialToDate(r[6]),
          event: String(r[7]||'').trim(),
          clause: String(r[14]||'').trim(),
          penaltyLevel: normalizePenaltyLevel(r[16]),
          violationType: normalizeVType(r[17]),
          fine: extractFine(r[18]),
          source: String(r[21]||'').trim(),
        });
      }
      if(parsed.length === 0) { alert('未解析到有效数据行'); return; }
      RAW_DATA = parsed;
      rebuildAll();
      alert(`成功导入 ${parsed.length} 条记录！`);
    } catch(err) {
      alert('导入失败：' + err.message);
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function exportCSV() {
  const filtered = getFiltered();
  const headers = ['序号','区域','门店','负责人','日期','具体事件','处罚原因(条款)','处罚类型','违纪类型','罚款','来源'];
  const keys = ['seq','region','store','manager','date','event','clause','penaltyLevel','violationType','fine','source'];
  const rows = [headers.join(',')];
  filtered.forEach(d => {
    const vals = keys.map(k => {
      let v = d[k] || '';
      v = String(v).replace(/"/g,'""');
      if(v.includes(',') || v.includes('"') || v.includes('\n')) v = '"' + v + '"';
      return v;
    });
    rows.push(vals.join(','));
  });
  const csv = '\uFEFF' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `处罚统计_导出_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportJSON() {
  const json = JSON.stringify(RAW_DATA, null, 2);
  const blob = new Blob([json], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `处罚统计_数据_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function handleJSONImport(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) { alert('JSON格式不正确：需要数组'); return; }
      RAW_DATA = data;
      rebuildAll();
      alert(`成功导入 ${data.length} 条记录！`);
    } catch(err) {
      alert('导入失败：' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

  RAW_DATA.forEach(d => {
    if(d.clause) {
      const key = d.clause.length > 40 ? d.clause.substring(0,40)+'...' : d.clause;
      if(!cCounts[key]) cCounts[key] = {count:0, full:d.clause};
      cCounts[key].count++;
    }
  });
  const cSorted = Object.entries(cCounts).sort((a,b)=>b[1].count-a[1].count).slice(0,8);
  const cMax = cSorted[0][1].count;
  document.getElementById('reasonChart').innerHTML = cSorted.map((c,i) => {
    const pct = cMax ? (c[1].count/cMax*100) : 0;
    return `<div class="bar-item"><div class="bar-label" title="${esc(c[1].full)}" style="width:200px;font-size:12px;">${esc(c[0])}</div><div class="bar-track"><div class="bar-fill color-${i}" style="width:${pct}%">${c[1].count>0?c[1].count:''}</div></div><div class="bar-count">${c[1].count}</div></div>`;
  }).join('');
}

function renderChips() {
  const pCounts = {};
  RAW_DATA.forEach(d => { const k=d.penaltyLevel||''; pCounts[k]=(pCounts[k]||0)+1; });
  document.getElementById('penaltyChips').innerHTML = PENALTY_ORDER.map(k => {
    const active = state.penaltyLevels.has(k) ? 'active' : '';
    return `<div class="chip ${active}" onclick="togglePenalty('${k}')">${PENALTY_LABELS[k]} <span class="count">(${pCounts[k]||0})</span></div>`;
  }).join('');

  const vCounts = {};
  RAW_DATA.forEach(d => { const k=d.violationType||''; vCounts[k]=(vCounts[k]||0)+1; });
  const vKeys = Object.keys(vCounts).sort((a,b)=>vCounts[b]-vCounts[a]);
  document.getElementById('vtypeChips').innerHTML = vKeys.map(k => {
    const active = state.violationTypes.has(k) ? 'active' : '';
    const label = VTYPE_LABELS[k] || k || '未分类';
    return `<div class="chip ${active}" onclick="toggleVtype('${k}')">${label} <span class="count">(${vCounts[k]})</span></div>`;
  }).join('');

  const rCounts = {};
  RAW_DATA.forEach(d => { if(d.region) rCounts[d.region]=(rCounts[d.region]||0)+1; });
  const rKeys = Object.keys(rCounts).sort((a,b)=>rCounts[b]-rCounts[a]);
  document.getElementById('regionChips').innerHTML = rKeys.map(k => {
    const active = state.regions.has(k) ? 'active' : '';
    return `<div class="chip ${active}" onclick="toggleRegion('${k}')">${k} <span class="count">(${rCounts[k]})</span></div>`;
  }).join('');

  const stores = [...new Set(RAW_DATA.filter(d=>d.store).map(d=>d.store))].sort();
  document.getElementById('storeSelect').innerHTML = '<option value="">全部门店</option>' +
    stores.map(s => `<option value="${s}">${s}</option>`).join('');
  document.getElementById('storeSelect').value = state.store;
}

function togglePenalty(k) {
  if(state.penaltyLevels.has(k)) state.penaltyLevels.delete(k); else state.penaltyLevels.add(k);
  state.page = 1; renderChips(); renderTable();
}
function toggleVtype(k) {
  if(state.violationTypes.has(k)) state.violationTypes.delete(k); else state.violationTypes.add(k);
  state.page = 1; renderChips(); renderTable();
}
function toggleRegion(k) {
  if(state.regions.has(k)) state.regions.delete(k); else state.regions.add(k);
  state.page = 1; renderChips(); renderTable();
}
function filterByPenalty(k) {
  state.penaltyLevels.clear(); state.penaltyLevels.add(k);
  state.page = 1; renderChips(); renderTable();
}
function filterByRegion(k) {
  state.regions.clear(); state.regions.add(k);
  state.page = 1; renderChips(); renderTable();
}
function filterByStore(storeName) {
  state.store = storeName;
  state.page = 1;
  document.getElementById('storeSelect').value = storeName;
  switchView('detail');
  renderTable();
}
function resetFilters() {
  state.penaltyLevels.clear(); state.violationTypes.clear(); state.regions.clear();
  state.store = ''; state.search = ''; state.page = 1;
  document.getElementById('searchInput').value = '';
  document.getElementById('storeSelect').value = '';
  renderChips(); renderTable();
}

function switchView(v) {
  state.view = v;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('storeView').style.display = 'none';
  document.getElementById('topicView').style.display = 'none';
  if(v === 'detail') {
    document.querySelector('.view-tab:nth-child(1)').classList.add('active');
    document.getElementById('detailView').style.display = '';
  } else if(v === 'topic') {
    document.querySelector('.view-tab:nth-child(2)').classList.add('active');
    document.getElementById('topicView').style.display = '';
    renderTopics();
  } else {
    document.querySelector('.view-tab:nth-child(3)').classList.add('active');
    document.getElementById('storeView').style.display = '';
    renderStoreSummary();
  }
}

function buildStoreSummary() {
  const storeMap = {};
  RAW_DATA.forEach(d => {
    if(!d.store) return;
    if(!storeMap[d.store]) {
      storeMap[d.store] = {store:d.store, region:d.region, total:0, eco:0, l1:0, l2:0, l3:0, dismiss:0, none:0, fine:0};
    }
    const s = storeMap[d.store];
    s.total++;
    s.fine += parseInt(d.fine)||0;
    switch(d.penaltyLevel) {
      case '经济处罚': s.eco++; break;
      case '一级批评教育': s.l1++; break;
      case '二级书面警告': s.l2++; break;
      case '三级降职降薪': s.l3++; break;
      case '解除劳动关系': s.dismiss++; break;
      default: s.none++;
    }
  });
  return Object.values(storeMap);
}

// === Topic Analysis ===
const TOPICS = [
  {key:'过期', icon:'📅', desc:'产品超过最佳售卖期、未废弃', color:'#d93025', bg:'#fce8e6'},
  {key:'旷工', icon:'🚪', desc:'一个月内旷工达1天，含迟到/早退/漏打卡', color:'#f9ab00', bg:'#fef7e0'},
];

function matchTopic(d, keyword) {
  const text = (d.event||'') + ' ' + (d.clause||'');
  return text.includes(keyword);
}

function renderTopics() {
  const html = TOPICS.map(topic => {
    const matches = RAW_DATA.filter(d => matchTopic(d, topic.key));
    const stores = new Set(matches.map(d=>d.store).filter(Boolean));
    const regions = new Set(matches.map(d=>d.region).filter(Boolean));
    const totalFine = matches.reduce((s,d) => s + (parseInt(d.fine)||0), 0);

    // Penalty level distribution
    const levels = {};
    matches.forEach(d => {
      const k = d.penaltyLevel || '未定级';
      levels[k] = (levels[k]||0)+1;
    });

    // Region distribution (top 5)
    const regionCounts = {};
    matches.forEach(d => { if(d.region) regionCounts[d.region] = (regionCounts[d.region]||0)+1; });
    const regionSorted = Object.entries(regionCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const regionMax = regionSorted[0] ? regionSorted[0][1] : 1;

    // Store distribution (top 5, >=2)
    const storeCounts = {};
    matches.forEach(d => { if(d.store) storeCounts[d.store] = (storeCounts[d.store]||0)+1; });
    const storeSorted = Object.entries(storeCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const storeMax = storeSorted[0] ? storeSorted[0][1] : 1;

    // Penalty level bars
    const levelOrder = ['三级降职降薪','二级书面警告','经济处罚','一级批评教育','解除劳动关系','未定级'];
    const levelColors = ['#9334c6','#d93025','#f9ab00','#1a73e8','#1a1a2e','#ccc'];
    const levelLabels = {'三级降职降薪':'三级·降职降薪','二级书面警告':'二级·书面警告','经济处罚':'经济处罚','一级批评教育':'一级·批评教育','解除劳动关系':'解除劳动关系','未定级':'未定级'};
    const levelBars = levelOrder.map((k,i) => {
      const count = levels[k]||0;
      const max = Math.max(...levelOrder.map(k2 => levels[k2]||0), 1);
      const pct = count/max*100;
      return count > 0 ? `<div class="topic-row">
        <div class="tlabel">${levelLabels[k]}</div>
        <div class="tbar"><div class="tfill" style="width:${pct}%;background:${levelColors[i]}">${count}</div></div>
        <div class="tnum">${count}</div>
      </div>` : '';
    }).join('');

    // Region bars
    const regionBars = regionSorted.map((r,i) => {
      const pct = r[1]/regionMax*100;
      return `<div class="topic-row">
        <div class="tlabel">${r[0]}</div>
        <div class="tbar"><div class="tfill color-${i%12}" style="width:${pct}%">${r[1]}</div></div>
        <div class="tnum">${r[1]}</div>
      </div>`;
    }).join('');

    // Store bars
    const storeBars = storeSorted.map((s,i) => {
      const pct = s[1]/storeMax*100;
      return `<div class="topic-row">
        <div class="tlabel" style="width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s[0]}</div>
        <div class="tbar"><div class="tfill color-${i%12}" style="width:${pct}%">${s[1]}</div></div>
        <div class="tnum">${s[1]}</div>
      </div>`;
    }).join('');

    return `<div class="topic-card">
      <div class="topic-header" onclick="filterByKeyword('${topic.key}')">
        <div class="topic-header-left">
          <div class="topic-icon" style="background:${topic.bg};color:${topic.color}">${topic.icon}</div>
          <div class="topic-info">
            <div class="tname">${topic.key}类违规</div>
            <div class="tdesc">${topic.desc}</div>
          </div>
        </div>
        <div class="topic-count">${matches.length}<span class="unit">条</span></div>
      </div>
      <div class="topic-body">
        <div style="display:flex;gap:20px;margin-bottom:4px;">
          <div style="font-size:13px;color:#888;">涉及门店 <b style="color:#333">${stores.size}</b> 家</div>
          <div style="font-size:13px;color:#888;">涉及区域 <b style="color:#333">${regions.size}</b> 个</div>
          ${totalFine > 0 ? `<div style="font-size:13px;color:#888;">罚款 <b style="color:#d93025">¥${totalFine}</b></div>` : ''}
        </div>
        <div class="topic-section-title">处罚类型分布</div>
        ${levelBars || '<div style="font-size:12px;color:#ccc;padding:8px 0">无数据</div>'}
        <div class="topic-section-title">区域分布 TOP5</div>
        ${regionBars || '<div style="font-size:12px;color:#ccc;padding:8px 0">无数据</div>'}
        <div class="topic-section-title">门店分布 TOP5</div>
        ${storeBars || '<div style="font-size:12px;color:#ccc;padding:8px 0">无数据</div>'}
        <button class="topic-btn" onclick="filterByKeyword('${topic.key}')">查看 ${matches.length} 条明细</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('topicGrid').innerHTML = html;
}

function filterByKeyword(keyword) {
  resetFilters();
  state.search = keyword;
  document.getElementById('searchInput').value = keyword;
  switchView('detail');
  renderTable();
  document.getElementById('detailView').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderStoreSummary() {
  let summary = buildStoreSummary();
  const key = state.storeSortKey;
  const dir = state.storeSortDir;
  summary.sort((a,b) => {
    let va = a[key], vb = b[key];
    if(typeof va === 'string') { va = va||''; vb = vb||''; }
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return 0;
  });

  document.getElementById('storeSummaryBody').innerHTML = summary.map(s => {
    const sel = state.store === s.store ? 'selected' : '';
    const safeStore = s.store.replace(/'/g, "\\'");
    return `<tr class="${sel}" onclick="filterByStore('${safeStore}')">
      <td><b>${s.store}</b></td>
      <td>${s.region||'—'}</td>
      <td class="num-cell" style="color:#667eea">${s.total}</td>
      <td class="num-cell">${s.eco?`<span class="mini-badge mb-eco">${s.eco}</span>`:'<span class="mini-badge mb-0">0</span>'}</td>
      <td class="num-cell">${s.l1?`<span class="mini-badge mb-1">${s.l1}</span>`:'<span class="mini-badge mb-0">0</span>'}</td>
      <td class="num-cell">${s.l2?`<span class="mini-badge mb-2">${s.l2}</span>`:'<span class="mini-badge mb-0">0</span>'}</td>
      <td class="num-cell">${s.l3?`<span class="mini-badge mb-3">${s.l3}</span>`:'<span class="mini-badge mb-0">0</span>'}</td>
      <td class="num-cell">${s.dismiss?s.dismiss:'—'}</td>
      <td class="num-cell" style="color:#999">${s.none||'—'}</td>
      <td class="num-cell">${s.fine?'¥'+s.fine:'—'}</td>
    </tr>`;
  }).join('');
}

function getFiltered() {
  return RAW_DATA.filter(d => {
    if(state.penaltyLevels.size > 0 && !state.penaltyLevels.has(d.penaltyLevel||'')) return false;
    if(state.violationTypes.size > 0 && !state.violationTypes.has(d.violationType||'')) return false;
    if(state.regions.size > 0 && !state.regions.has(d.region)) return false;
    if(state.store && d.store !== state.store) return false;
    if(state.search) {
      const q = state.search.toLowerCase();
      const text = (d.store+' '+d.event+' '+d.clause+' '+d.region+' '+d.manager).toLowerCase();
      if(!text.includes(q)) return false;
    }
    return true;
  });
}

function sortData(data) {
  const key = state.sortKey; const dir = state.sortDir;
  return data.sort((a,b) => {
    let va = a[key] || ''; let vb = b[key] || '';
    if(key === 'seq' || key === 'fine') { va = parseInt(va)||0; vb = parseInt(vb)||0; }
    if(key === 'date') { va = va.replace('月','/').replace('日',''); vb = vb.replace('月','/').replace('日',''); }
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return 0;
  });
}

function renderTable() {
  let filtered = sortData([...getFiltered()]);
  document.getElementById('filteredCount').textContent = filtered.length;

  const activeParts = [];
  if(state.penaltyLevels.size) activeParts.push('处罚类型: '+[...state.penaltyLevels].map(k=>PENALTY_LABELS[k]).join(', '));
  if(state.violationTypes.size) activeParts.push('违纪类型: '+[...state.violationTypes].map(k=>VTYPE_LABELS[k]||k).join(', '));
  if(state.regions.size) activeParts.push('区域: '+[...state.regions].join(', '));
  if(state.store) activeParts.push('门店: '+state.store);
  if(state.search) activeParts.push('搜索: "'+state.search+'"');
  document.getElementById('activeFilters').textContent = activeParts.join(' | ');

  document.querySelectorAll('#dataTable thead th').forEach(th => {
    const icon = th.querySelector('.sort-icon');
    if(icon) { if(th.dataset.sort === state.sortKey) icon.textContent = state.sortDir > 0 ? '▲' : '▼'; else icon.textContent = ''; }
  });

  const totalPages = Math.ceil(filtered.length / state.pageSize);
  if(state.page > totalPages) state.page = 1;
  const start = (state.page-1) * state.pageSize;
  const pageData = filtered.slice(start, start + state.pageSize);

  if(pageData.length === 0) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" class="empty-row">没有符合条件的记录</td></tr>';
  } else {
    document.getElementById('tableBody').innerHTML = pageData.map(d => {
      const pLevel = d.penaltyLevel || '';
      const pClass = PENALTY_CLASSES[pLevel]; const pLabel = PENALTY_LABELS[pLevel];
      const vType = d.violationType || ''; const vClass = VTYPE_CLASSES[vType];
      const vLabel = VTYPE_LABELS[vType] || vType || '—';
      const fineStr = d.fine ? '¥'+d.fine : '—';
      return `<tr>
        <td>${d.seq}</td><td>${d.region||'—'}</td><td><b>${d.store||'—'}</b></td>
        <td>${d.date||'—'}</td>
        <td class="event-cell"><div class="truncate" onclick="this.classList.toggle('expanded')">${esc(d.event)||'—'}</div></td>
        <td class="clause-cell"><div class="truncate" onclick="this.classList.toggle('expanded')">${esc(d.clause)||'—'}</div></td>
        <td><span class="badge ${pClass}">${pLabel}</span></td>
        <td><span class="vtype-tag ${vClass}">${vLabel}</span></td>
        <td>${fineStr}</td>
      </tr>`;
    }).join('');
  }

  let pagiHtml = '';
  pagiHtml += `<button class="page-btn" onclick="goPage(${state.page-1})" ${state.page<=1?'disabled':''}>上一页</button>`;
  const maxBtns = 7;
  let s2 = Math.max(1, state.page - 3);
  let e2 = Math.min(totalPages, s2 + maxBtns - 1);
  s2 = Math.max(1, e2 - maxBtns + 1);
  for(let i=s2; i<=e2; i++) pagiHtml += `<button class="page-btn ${i===state.page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  pagiHtml += `<button class="page-btn" onclick="goPage(${state.page+1})" ${state.page>=totalPages?'disabled':''}>下一页</button>`;
  pagiHtml += `<span style="font-size:13px;color:#888;margin-left:8px;">第 ${state.page}/${totalPages||1} 页</span>`;
  document.getElementById('pagination').innerHTML = pagiHtml;
}

function esc(s) { if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function goPage(p) { state.page = p; renderTable(); }

function copyShareLink() {
  const url = window.location.href;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert('链接已复制到剪贴板！\n\n直接粘贴发给同事即可打开看板。');
    }).catch(() => { prompt('请复制此链接分享给同事：', url); });
  } else {
    prompt('请复制此链接分享给同事：', url);
  }
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  state.search = e.target.value.trim(); state.page = 1; renderTable();
});
document.getElementById('storeSelect').addEventListener('change', function(e) {
  state.store = e.target.value; state.page = 1; renderTable();
});
document.querySelectorAll('#dataTable thead th[data-sort]').forEach(th => {
  th.addEventListener('click', function() {
    const key = this.dataset.sort;
    if(state.sortKey === key) state.sortDir *= -1;
    else { state.sortKey = key; state.sortDir = 1; }
    renderTable();
  });
});
document.querySelectorAll('.store-summary-table thead th[data-ssort]').forEach(th => {
  th.addEventListener('click', function() {
    const key = this.dataset.ssort;
    if(state.storeSortKey === key) state.storeSortDir *= -1;
    else { state.storeSortKey = key; state.storeSortDir = key === 'store' || key === 'region' ? 1 : -1; }
    renderStoreSummary();
  });
});

renderSummary();
renderCharts();
renderChips();
renderTable();
</script>
</body>
</html>
