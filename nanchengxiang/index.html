<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#C41A1A">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <title>南城香协作终端</title>
</head>
<body>

  <!-- 顶部标题栏 -->
  <header class="app-header">
    <span class="header-back" id="header-back" onclick="history.back()">&#8592;</span>
    <span id="header-title">南城香协作终端</span>
    <span class="header-user" id="header-user"></span>
    <button class="header-logout" id="header-logout" onclick="App.logout()">退出</button>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">

    <!-- 登录页 -->
    <div class="page active" id="page-login"></div>

    <!-- 首页 -->
    <div class="page" id="page-home"></div>

    <!-- 门店检查（线上组） -->
    <div class="page" id="page-inspection"></div>

    <!-- 线下门店检查 -->
    <div class="page" id="page-offline-inspect"></div>

    <!-- 处罚登记 -->
    <div class="page" id="page-penalty"></div>
    <div class="page" id="page-daily"></div>

    <!-- 差评申诉 -->
    <div class="page" id="page-complaint"></div>

    <!-- 领导看板 / 看板中心 -->
    <div class="page" id="page-dashboard"></div>
    <div class="page" id="page-complaintBoard"></div>
    <div class="page" id="page-penaltyBoard"></div>
    <div class="page" id="page-taskBoard"></div>

    <!-- 通知模板 -->
    <div class="page" id="page-template"></div>

    <!-- 数据管理（总部专享） -->
    <div class="page" id="page-admin"></div>

    <!-- 任务发布 -->
    <div class="page" id="page-task"></div>

    <!-- 稽核模块 -->
    <div class="page" id="page-inspectionTemplates"></div>
    <div class="page" id="page-inspectionFill"></div>
    <div class="page" id="page-inspectionResults"></div>
    <div class="page" id="page-inspectionIssues"></div>
    <div class="page" id="page-inspectionWorkbench"></div>
    <div class="page" id="page-correction"></div>
    <div class="page" id="page-permissionConfig"></div>

<div class="page" id="page-inspectionDashboard"></div>

<div class="page" id="page-supplyChain"></div>

<!-- SSC 模块（仅管理员可见） -->
<div class="page" id="page-ssc"></div>

  </main>

  <!-- 底部 TabBar -->
  <nav class="tabbar" id="tabbar" style="display:none">
    <div class="tab-item active" data-page="home">
      <span class="tab-icon">&#8962;</span>
      <span>首页</span>
    </div>
    <div class="tab-item" data-page="inspection">
      <span class="tab-icon">&#10003;</span>
      <span>到店稽核</span>
    </div>
    <div class="tab-item" data-page="daily" onclick="App.navigate('daily')">
      <span class="tab-icon">&#128203;</span>
      <span class="tab-label">日报</span>
    </div>
    <div class="tab-item" data-page="penalty">
      <span class="tab-icon">&#9888;</span>
      <span>处罚</span>
    </div>
    <div class="tab-item" data-page="complaint">
      <span class="tab-icon">&#9993;</span>
      <span>差评</span>
    </div>
    <div class="tab-item" data-page="dashboard">
      <span class="tab-icon">&#9776;</span>
      <span>看板</span>
    </div>
    <div class="tab-item" data-page="template">
      <span class="tab-icon">&#128276;</span>
      <span>通知</span>
    </div>
    <div class="tab-item" data-page="task">
      <span class="tab-icon">&#128203;</span>
      <span>任务</span>
    </div>
    <div class="tab-item" data-page="supplyChain">
      <span class="tab-icon">&#128279;</span>
      <span>供应链</span>
    </div>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="event.target===this && this.classList.remove('show')">
    <div class="modal-box"></div>
  </div>

  <!-- 安装到桌面引导（PWA） -->
  <script>
  (function () {
    var DISMISS_KEY = 'ic_dismiss_until';
    var deferred = null;
    var ua = navigator.userAgent || '';
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isWeChat = /MicroMessenger|WeWork|QQ\//i.test(ua);
    var isAndroid = /Android|Adr/i.test(ua);
    var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      try { if (window.Installer) window.Installer.refreshCard(); } catch (err) {}
    });
    window.addEventListener('appinstalled', function () {
      deferred = null;
      try { localStorage.setItem(DISMISS_KEY, String(Date.now() + 3650 * 86400000)); } catch (err) {}
      removeCard();
      if (window.App && App.toast) { App.toast('已安装到桌面'); }
    });

    function dismissed() {
      try { return Date.now() < Number(localStorage.getItem(DISMISS_KEY) || 0); } catch (err) { return false; }
    }

    function removeCard() {
      var el = document.getElementById('ic-card');
      if (el && el.parentNode) { el.parentNode.removeChild(el); }
      var mini = document.getElementById('ic-mini');
      if (mini && mini.parentNode) { mini.parentNode.removeChild(mini); }
    }

    function closeSheet() {
      var m = document.getElementById('ic-sheet-mask');
      if (m && m.parentNode) { m.parentNode.removeChild(m); }
    }

    function openSheet(title, steps, opts) {
      opts = opts || {};
      closeSheet();
      var mask = document.createElement('div');
      mask.className = 'ic-mask';
      mask.id = 'ic-sheet-mask';
      mask.onclick = function (e) { if (e.target === mask) { closeSheet(); } };
      var items = '';
      for (var i = 0; i < steps.length; i++) {
        items += '<div class="ic-step"><span class="ic-step-no">' + (i + 1) + '</span><span>' + steps[i] + '</span></div>';
      }
      var tip = opts.tip ? '<div class="ic-sheet-tip">' + opts.tip + '</div>' : '';
      var copyBtn = opts.copy ? '<button class="ic-sheet-btn ic-sheet-copy" onclick="Installer.copyLink()">复制当前链接</button>' : '';
      mask.innerHTML = '<div class="ic-sheet">'
        + '<div class="ic-sheet-title">' + title + '</div>'
        + tip
        + items
        + copyBtn
        + '<button class="ic-sheet-btn" onclick="Installer.closeSheet()">知道了</button>'
        + '</div>';
      document.body.appendChild(mask);
    }

    var Installer = {
      canPrompt: function () { return !!deferred; },
      dismissed: dismissed,
      shouldShow: function () {
        if (standalone) { return false; }
        return true;
      },
      hintText: function () {
        if (deferred) { return '点击「安装」，浏览器会直接弹出安装确认'; }
        if (isWeChat) { return '微信内无法直接安装，先复制链接到浏览器打开'; }
        if (isIOS) { return 'iOS 请通过「分享 → 添加到主屏幕」完成安装'; }
        if (isAndroid) { return '点击查看安卓手机安装步骤'; }
        return '点击查看电脑浏览器安装步骤';
      },
      refreshCard: function () {
        if (window.Pages && typeof Pages.refreshInstallCard === 'function') { Pages.refreshInstallCard(); }
      },
      dismiss: function () {
        try { localStorage.setItem(DISMISS_KEY, String(Date.now() + 7 * 86400000)); } catch (err) {}
        removeCard();
        Installer.refreshCard();
      },
      closeSheet: closeSheet,
      openSheet: openSheet,
      copyLink: function () {
        var url = location.href;
        function ok() { if (window.App && App.toast) { App.toast('链接已复制，请到浏览器粘贴打开'); } }
        function fallback() {
          try {
            var ta = document.createElement('textarea');
            ta.value = url;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, url.length);
            document.execCommand('copy');
            document.body.removeChild(ta);
            ok();
          } catch (err) {
            if (window.App && App.toast) { App.toast('请手动长按页面地址复制链接'); }
          }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(ok, fallback);
        } else {
          fallback();
        }
      },
      trigger: function () {
        if (deferred) {
          var p = deferred;
          deferred = null;
          try { p.prompt(); } catch (err) {}
          if (p.userChoice && p.userChoice.then) {
            p.userChoice.then(function (r) {
              if (r && r.outcome === 'accepted') { Installer.dismiss(); }
              else { Installer.refreshCard(); }
            });
          }
          return;
        }
        if (isWeChat) {
          Installer.openSheet('微信内无法直接安装', [
            '点击下方「复制当前链接」按钮',
            '在手机浏览器（安卓浏览器 / Safari）中粘贴并打开',
            '在浏览器里再点「安装应用 / 添加到主屏幕」'
          ], { copy: true, tip: '微信内置浏览器不支持安装到桌面，必须用系统浏览器打开本页面。' });
        } else if (isIOS) {
          Installer.openSheet('添加到主屏幕', [
            '点击底部（或顶部）的「分享」按钮',
            '向下滑动找到「添加到主屏幕」',
            '点右上角「添加」，桌面即出现图标'
          ], { copy: true, tip: '若当前在微信内，请先点「复制当前链接」，再用 Safari 打开。' });
        } else if (isAndroid) {
          Installer.openSheet('安装到桌面', [
            '点击浏览器右上角菜单（⋮）',
            '选择「安装应用」或「添加到主屏幕」',
            '确认后桌面即出现独立图标'
          ], { copy: true, tip: '若菜单中没有「安装应用」，请改用 Chrome 等标准浏览器打开本页面。' });
        } else {
          Installer.openSheet('安装到桌面', [
            '点击地址栏右侧的「安装」图标（显示器 / ⊕ 图标）',
            '或点击浏览器右上角菜单（⋮）→「安装南城香协作」',
            '确认后即可以独立窗口运行'
          ], { copy: true, tip: 'Chrome / Edge 支持一键安装为独立窗口应用。' });
        }
      }
    };

    window.Installer = Installer;
  })();
  </script>

  <script src="vendor/supabase.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
  <script src="vendor/tesseract.min.js"></script>

  <!-- 异步加载 xlsx（不阻塞渲染） -->
  <script async src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
          onerror="console.warn('xlsx CDN 加载失败，Excel 功能不可用')"></script>

  <!-- 异步加载 jszip（稽核照片打包下载用） -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
          onerror="console.warn('jszip CDN 加载失败，照片打包降级为逐张下载')"></script>

  <!-- Service Worker -->
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }
  </script>

</body>
</html>
