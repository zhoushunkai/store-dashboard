<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">

</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>门店管理组绩效公示平台</title>

<style>

:root {

  --s-color: #D4A017; --s-bg: #FFF8E1; --s-border: #FFD54F;

  --a-color: #2E7D32; --a-bg: #E8F5E9; --a-border: #81C784;

  --b-color: #1565C0; --b-bg: #E3F2FD; --b-border: #64B5F6;

  --c-color: #E65100; --c-bg: #FFF3E0; --c-border: #FFB74D;

  --d-color: #B71C1C; --d-bg: #FFEBEE; --d-border: #E57373;

  --direct-color: #6A1B9A; --direct-bg: #F3E5F5; --direct-border: #CE93D8;

  --bg: #f5f6f8; --card-bg: #fff; --text: #333; --text2: #666; --border: #e0e0e0;

}

* { margin: 0; padding: 0; box-sizing: border-box; }

body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }



header { background: linear-gradient(135deg, #1a237e, #283593); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

header h1 { font-size: 20px; font-weight: 600; }

.header-right { display: flex; align-items: center; gap: 12px; }

.header-right select { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.15); color: #fff; font-size: 14px; cursor: pointer; }

.header-right select option { color: #333; }



.stats-bar { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }

.stat-card { background: var(--card-bg); border-radius: 10px; padding: 14px 20px; min-width: 100px; flex: 1; box-shadow: 0 1px 4px rgba(0,0,0,.06); text-align: center; }

.stat-card .num { font-size: 28px; font-weight: 700; }

.stat-card .label { font-size: 12px; color: var(--text2); margin-top: 2px; }



.tabs { display: flex; gap: 0; margin: 0 24px; background: var(--card-bg); border-radius: 10px 10px 0 0; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

.tab-btn { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500; border: none; background: transparent; color: var(--text2); transition: .2s; border-bottom: 2px solid transparent; }

.tab-btn.active { color: #1a237e; border-bottom-color: #1a237e; font-weight: 600; }

.tab-btn:hover { background: #f5f5f5; }



.content { margin: 0 24px 24px; background: var(--card-bg); border-radius: 0 0 10px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); padding: 20px; min-height: 400px; max-height: calc(100vh - 130px); overflow-y: auto; }



/* ====== 排名视图 ====== */

.level-section { margin-bottom: 24px; }

.level-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }

.level-badge { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; font-weight: 700; font-size: 18px; color: #fff; }

.level-badge.S { background: var(--s-color); }

.level-badge.A { background: var(--a-color); }

.level-badge.B { background: var(--b-color); }

.level-badge.C { background: var(--c-color); }

.level-badge.D { background: var(--d-color); }

.level-count { font-size: 13px; color: var(--text2); }

.store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

.store-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; transition: .15s; background: #fff; }

.store-card:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,0,0,.1); }

.store-card.S { border-left: 4px solid var(--s-color); }

.store-card.A { border-left: 4px solid var(--a-color); }

.store-card.B { border-left: 4px solid var(--b-color); }

.store-card.C { border-left: 4px solid var(--c-color); }

.store-card.D { border-left: 4px solid var(--d-color); }

.store-card .sc-top { display: flex; justify-content: space-between; align-items: flex-start; }

.store-card .sc-name { font-weight: 600; font-size: 15px; }

.store-card .sc-region { font-size: 12px; color: var(--text2); }

.store-card .sc-score { font-size: 22px; font-weight: 700; text-align: right; }

.store-card .sc-manager { font-size: 12px; color: var(--text2); margin-top: 4px; }

.store-card .sc-rank { font-size: 11px; color: #999; }



/* ====== 区域汇总 ====== */



.region-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }

.region-table thead th { position: sticky; top: 0; z-index: 5;  background: #f8f9fa; padding: 10px 8px; text-align: left; border-bottom: 2px solid #dee2e6; font-weight: 600; white-space: nowrap; }

.region-table td { padding: 8px; border-bottom: 1px solid #eee; }

.region-table tr:hover { background: #fafafa; }



/* ====== 个人数据看板 ====== */

.person-search { margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.person-search input { flex: 1; min-width: 200px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }

.person-search input:focus { border-color: #1a237e; box-shadow: 0 0 0 3px rgba(26,35,126,.1); }

.person-search select { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; cursor: pointer; }

.person-search .ps-count { font-size: 13px; color: var(--text2); white-space: nowrap; }



.section-title { font-size: 16px; font-weight: 700; padding: 14px 16px; margin: 20px 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }

.section-title.person-group { background: #f5f5f5; color: #555; }

.section-title.direct-group { background: linear-gradient(135deg, #f3e5f5, #e1bee7); color: var(--direct-color); }

.section-title .st-count { font-size: 13px; font-weight: 400; opacity: .7; }



.person-table-wrap { margin-bottom: 24px; }

.person-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; white-space: nowrap; }

.person-table thead th { position: sticky; top: 0; z-index: 5; background: #1a237e; color: #fff; padding: 8px 10px; font-weight: 500; text-align: center; font-size: 11px; border-bottom: 2px solid #0d1657; }

.person-table th.col-store { text-align: left; min-width: 110px; position: sticky; top: 0; left: 0; z-index: 7; background: #1a237e; }

.person-table th.col-region { min-width: 70px; }

.person-table th.col-manager { min-width: 60px; }

.person-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #e8e8e8; background: #fff; }

.person-table td.col-store { text-align: left; font-weight: 600; position: sticky; left: 0; z-index: 4; background: #fff; }

.person-table tr:hover td { background: #f0f4ff !important; }

.person-table tr:hover td.col-store { background: #f0f4ff !important; }

.person-table tr.row-direct td.col-store { background: var(--direct-bg) !important; }

.person-table tr.row-direct:hover td.col-store { background: #ede7f6 !important; }

.person-table tr.row-direct td { background: #faf5fc; }

.person-table tr.row-direct:hover td { background: #ede7f6; }

.person-table .cell-score { font-weight: 700; font-size: 14px; }

.person-table .cell-total { font-weight: 700; font-size: 15px; }

.person-table .cell-lv { font-weight: 700; font-size: 13px; display: inline-block; padding: 1px 6px; border-radius: 3px; }

.person-table .col-total { min-width: 50px; }

.person-table .col-lv { min-width: 40px; }

.person-table .col-rank { min-width: 40px; }





.hdr-btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font-weight: 500; transition: .15s; white-space: nowrap; }

.hdr-btn:hover { background: rgba(255,255,255,.25); }

.hdr-btn.btn-export { border-color: rgba(129,199,132,.5); }

.hdr-btn.btn-export:hover { background: rgba(129,199,132,.3); }

.hdr-btn.btn-import { border-color: rgba(144,202,249,.5); }

.hdr-btn.btn-import:hover { background: rgba(144,202,249,.3); }

.hdr-btn.btn-save { border-color: rgba(255,183,77,.5); }

.hdr-btn.btn-save:hover { background: rgba(255,183,77,.3); }

.hdr-btn.btn-share { border-color: rgba(206,147,216,.5); }

.hdr-btn.btn-share:hover { background: rgba(206,147,216,.3); }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; }

.toast.show { opacity: 1; }





/* ====== 年度汇总 ====== */

.annual-search { margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.annual-search input { flex: 1; min-width: 200px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }

.annual-search input:focus { border-color: #1a237e; box-shadow: 0 0 0 3px rgba(26,35,126,.1); }

.annual-search select { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; cursor: pointer; }

.annual-search .as-count { font-size: 13px; color: var(--text2); white-space: nowrap; }



.annual-table-wrap { }

.annual-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; white-space: nowrap; }

.annual-table thead th { position: sticky; top: 0; z-index: 5; background: #1a237e; color: #fff; padding: 8px 10px; font-weight: 500; text-align: center; font-size: 11px; border-bottom: 2px solid #0d1657; }

.annual-table th.col-store { text-align: left; min-width: 110px; position: sticky; top: 0; left: 0; z-index: 7; background: #1a237e; }

.annual-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #e8e8e8; background: #fff; }

.annual-table td.col-store { text-align: left; font-weight: 600; position: sticky; left: 0; z-index: 4; background: #fff; }

.annual-table tr:hover td { background: #f0f4ff !important; }

.annual-table tr:hover td.col-store { background: #f0f4ff !important; }

.annual-table tr.row-direct td.col-store { background: var(--direct-bg) !important; }

.annual-table tr.row-direct:hover td.col-store { background: #ede7f6 !important; }

.annual-table .cell-month-lv { font-weight: 700; font-size: 12px; display: inline-block; padding: 1px 5px; border-radius: 3px; min-width: 24px; }

.annual-table .cell-month-score { font-weight: 600; font-size: 12px; }

.annual-table .cell-avg { font-weight: 700; font-size: 14px; }

.annual-table .cell-best { color: #D4A017; font-weight: 700; }

.annual-table td.month-na { color: #ccc; }



.annual-summary { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }

.annual-summary .as-card { background: #f8f9fa; border-radius: 8px; padding: 12px 18px; flex: 1; min-width: 120px; text-align: center; }

.annual-summary .as-card .num { font-size: 24px; font-weight: 700; }

.annual-summary .as-card .label { font-size: 11px; color: var(--text2); margin-top: 2px; }



.empty-state { text-align: center; padding: 60px 20px; color: #999; }



@media (max-width: 768px) {

  header { padding: 12px 16px; }

  header h1 { font-size: 17px; }

  .stats-bar { padding: 10px 16px; gap: 8px; }

  .store-grid { grid-template-columns: 1fr; }

  .person-grid { grid-template-columns: 1fr; }

  .tabs, .content { margin-left: 12px; margin-right: 12px; max-height: calc(100vh - 120px); overflow-y: auto; }

  .stat-card { padding: 10px 12px; }

  .stat-card .num { font-size: 22px; }

}

</style>

</head>

</div>

function getCurrentMonth() { return document.getElementById('monthSelect').value; }

function getMonthData(month) { return (ALL_DATA[month] || []).filter(function(d){ return d.total != null; }); }

function getValid() { return getMonthData(getCurrentMonth()); }

function onMonthChange() { renderStats(); switchTab(document.querySelector('.tab-btn.active').dataset.tab); }



function renderStats() {

  var valid = getValid();

  var levels = {S:0,A:0,B:0,C:0,D:0};

  var maxS=0,minS=100,direct=0;

  valid.forEach(function(d){

    var lv=d.mgmt_level; if(lv) levels[lv]=(levels[lv]||0)+1;

    if(d.total>maxS) maxS=d.total; if(d.total<minS) minS=d.total;

    if(d.manager==='区域代管'||d.manager==='区域直管') direct++;

  });

  document.getElementById('statsBar').innerHTML =

    '<div class="stat-card"><div class="num">'+valid.length+'</div><div class="label">参评门店</div></div>'+

    '<div class="stat-card"><div class="num" style="color:#D4A017">'+(levels.S||0)+'</div><div class="label">S级 ≥90</div></div>'+

    '<div class="stat-card"><div class="num" style="color:#2E7D32">'+(levels.A||0)+'</div><div class="label">A级 ≥85</div></div>'+

    '<div class="stat-card"><div class="num" style="color:#1565C0">'+(levels.B||0)+'</div><div class="label">B级 ≥75</div></div>'+

    '<div class="stat-card"><div class="num" style="color:#E65100">'+(levels.C||0)+'</div><div class="label">C级 ≥65</div></div>'+

    '<div class="stat-card"><div class="num" style="color:#B71C1C">'+(levels.D||0)+'</div><div class="label">D级 &lt;65</div></div>'+

    '<div class="stat-card"><div class="num" style="color:#6A1B9A">'+direct+'</div><div class="label">区域直管</div></div>'+

    '<div class="stat-card"><div class="num">'+maxS.toFixed(1)+'</div><div class="label">最高分</div></div>'+

    '<div class="stat-card"><div class="num">'+minS.toFixed(1)+'</div><div class="label">最低分</div></div>';

}



function renderRanking() {

  var valid = getValid();

  var levelOrder = ['S','A','B','C','D'];

  var grouped = {};

  levelOrder.forEach(function(l){ grouped[l]=[]; });

  valid.forEach(function(d){

    var lv = d.mgmt_level;

    if (grouped[lv]) grouped[lv].push(d);

  });

  var html = '';

  levelOrder.forEach(function(lv){

    var stores = grouped[lv];

    if (!stores.length) return;

    stores.sort(function(a,b){ return b.total-a.total; });

    html += '<div class="level-section"><div class="level-header"><span class="level-badge '+lv+'">'+lv+'</span><span class="level-count">'+stores.length+' 家门店 · '+stores[stores.length-1].total+' ~ '+stores[0].total+' 分</span></div><div class="store-grid">';

    stores.forEach(function(s){

      var isDirect = s.manager==='区域代管' ? ' <span style="font-size:10px;background:#f3e5f5;color:#6A1B9A;padding:1px 5px;border-radius:3px">直管</span>' : '';

      html += '<div class="store-card '+lv+'"><div class="sc-top"><div><div class="sc-name">'+s.store+isDirect+'</div><div class="sc-region">'+s.region+'</div></div><div class="sc-score">'+s.total+'</div></div><div class="sc-manager">负责人：'+(s.manager||'—')+'</div><div class="sc-rank">排名 #'+s.rank+'</div></div>';

    });

    html += '</div></div>';

  });

  return html;

}



function renderRegion() {

  var valid = getValid();

  var regions = {};

  valid.forEach(function(d){

    if (!regions[d.region]) regions[d.region] = {stores:[],total:0,directCount:0};

    regions[d.region].stores.push(d);

    regions[d.region].total += d.total;

    if (d.manager==='区域代管') regions[d.region].directCount++;

  });

  var rlist = Object.keys(regions).map(function(k){

    var r = regions[k];

    var metrics = {}, levels = {S:0,A:0,B:0,C:0,D:0};

    r.stores.forEach(function(d){

      if (d.mgmt_level) levels[d.mgmt_level]=(levels[d.mgmt_level]||0)+1;

      Object.keys(SCORE_MAX).forEach(function(m){

        if (!metrics[m]) metrics[m]=0;

        metrics[m] += (d[m]||0);

      });

    });

    Object.keys(metrics).forEach(function(m){ metrics[m]=(metrics[m]/r.stores.length).toFixed(1); });

    return {name:k, count:r.stores.length, avg:r.total/r.stores.length, directCount:r.directCount, levels:levels, metrics:metrics};

  });

  rlist.sort(function(a,b){ return b.avg - a.avg; });

  var mkeys = Object.keys(SCORE_MAX);

  var html = '<div class="region-table-wrap"><table class="region-table"><thead><tr><th>#</th><th>区域</th><th>店数</th><th>直管</th><th>S</th><th>A</th><th>B</th><th>C</th><th>D</th><th>均分</th>';

  mkeys.forEach(function(k){ html += '<th style="font-size:10px">'+SCORE_LABELS[k]+'</th>'; });

  html += '</tr></thead><tbody>';

  rlist.forEach(function(r,i){

    var lvs = ['S','A','B','C','D'].map(function(l){ return '<span style="color:var(--'+l.toLowerCase()+'-color);font-weight:600">'+(r.levels[l]||0)+'</span>'; }).join(' / ');

    html += '<tr><td><strong>'+(i+1)+'</strong></td><td><strong>'+r.name+'</strong></td><td>'+r.count+'</td><td style="color:#6A1B9A;font-weight:600">'+(r.directCount||'-')+'</td><td colspan="5" style="font-size:11px">'+lvs+'</td><td><strong>'+r.avg.toFixed(1)+'</strong></td>';

    mkeys.forEach(function(k){

      var v = parseFloat(r.metrics[k]);

      var pct = v/SCORE_MAX[k]*100;

      var c = pct>=90?'#D4A017':pct>=75?'#2E7D32':pct>=60?'#1565C0':pct>=40?'#E65100':'#B71C1C';

      html += '<td><span style="color:'+c+';font-weight:500">'+r.metrics[k]+'</span><span style="font-size:10px;color:#aaa">/'+SCORE_MAX[k]+'</span></td>';

    });

    html += '</tr>';

  });

  html += '</tbody></table></div>';

  return html;

}





function renderPerson() {

  var valid = getValid();

  var directStores = [];

  var normalStores = [];

  valid.forEach(function(d){

    if (d.manager==='区域代管' || d.manager==='区域直管') directStores.push(d);

    else normalStores.push(d);

  });

  directStores.sort(function(a,b){ return b.total - a.total; });

  normalStores.sort(function(a,b){ return b.total - a.total; });



  var regionSet = {};

  valid.forEach(function(d){ regionSet[d.region]=1; });

  var regionOptions = '<option value="">全部区域</option>';

  Object.keys(regionSet).sort().forEach(function(r){ regionOptions += '<option value="'+r+'">'+r+'</option>'; });



  var mkeys = Object.keys(SCORE_LABELS);



  var makeThead = function(){ 

    var h = '<tr><th class="col-rank">#</th><th class="col-store">门店</th><th class="col-region">区域</th><th class="col-manager">负责人</th><th class="col-lv">级别</th><th class="col-total">合计</th>';

    mkeys.forEach(function(k){ h += '<th>'+SCORE_LABELS[k]+'</th>'; });

    h += '</tr>';

    return h;

  };



  var toRow = function(d, cls){

    var lv = d.mgmt_level||'?';

    var rowCls = cls==='direct' ? ' row-direct' : '';

    var h = '<tr class="'+rowCls+'"><td>'+d.rank+'</td><td class="col-store">'+d.store+'</td><td>'+d.region+'</td><td>'+(d.manager||'—')+'</td><td><span class="cell-lv" style="background:'+lc.bg+';color:'+lc.color+'">'+lv+'</span></td><td><span class="cell-total" style="color:'+lc.color+'">'+d.total+'</span></td>';

    mkeys.forEach(function(k){

      var v = d[k]!=null ? d[k] : '—';

      var pct = typeof v==='number' ? v/SCORE_MAX[k] : 0;

      var c = pct>=0.9?'#D4A017':pct>=0.75?'#2E7D32':pct>=0.6?'#1565C0':pct>=0.4?'#E65100':pct>0?'#B71C1C':'#999';

      h += '<td><span class="cell-score" style="color:'+c+'">'+v+'</span></td>';

    });

  // 普通门店

  html += '<div class="section-title person-group">普通门店<span class="st-count">'+normalStores.length+' 家</span></div>';

  html += '<div class="person-table-wrap"><table class="person-table" id="normalTable"><thead>'+makeThead()+'</thead><tbody>';

  normalStores.forEach(function(d){ html += toRow(d, ''); });

  html += '</tbody></table></div>';



  // 区域直管

  html += '<div class="section-title direct-group">区域直管<span class="st-count">'+directStores.length+' 家</span></div>';

  html += '<div class="person-table-wrap"><table class="person-table" id="directTable"><thead>'+makeThead()+'</thead><tbody>';

  return html;

}



function filterPerson() {

  var q = (document.getElementById('personSearchInput').value||'').trim().toLowerCase();

  var rf = document.getElementById('personRegionFilter').value;

  var totalCount = 0;

  ['normalTable','directTable'].forEach(function(tid){

    var table = document.getElementById(tid);

    if (!table) return;

    var rows = table.querySelectorAll('tbody tr');

    var visibleCount = 0;

    rows.forEach(function(row){

      var txt = row.textContent.toLowerCase();

      var cells = row.querySelectorAll('td');

      var regionText = cells.length>=3 ? cells[2].textContent : '';

      var matchText = !q || txt.indexOf(q)>=0;

      var matchRegion = !rf || regionText.indexOf(rf)>=0;

      if (matchText && matchRegion) { row.style.display=''; visibleCount++; }

      else { row.style.display='none'; }

    });

    totalCount += visibleCount;

    var section = table.parentElement.previousElementSibling;

    if (section && section.classList.contains('section-title')) {

      section.style.display = visibleCount===0 ? 'none' : '';

    }

  });

  document.getElementById('personCount').textContent = '显示 '+totalCount+' 家';

}

function exportData() {

  var data = getCurrentData();

  var mkeys = Object.keys(SCORE_LABELS);

  // Build sheet data: header + rows

  var header = ['序号','区域','门店','负责人'].concat(mkeys).concat(['合计','店管理组级别（new）','门店级别','店管理组级别（new）90/85/75/65']);

  var rows = [header];

  data.forEach(function(d){

    var row = [d.rank, d.region, d.store, d.manager||''];

    mkeys.forEach(function(k){ row.push(d[k]!=null ? d[k] : ''); });

    row.push(d.total, d.mgmt_level||'', d.store_level||'', d.mgmt_level_code||'');

    rows.push(row);

  });

  var ws = XLSX.utils.aoa_to_sheet(rows);

  // Set column widths

  ws['!cols'] = [{wch:6},{wch:14},{wch:18},{wch:10}].concat(mkeys.map(function(){ return {wch:10}; })).concat([{wch:8},{wch:14},{wch:10},{wch:18}]);

  var wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, '门店使用');

  var month = document.getElementById('monthSelect').value;

  XLSX.writeFile(wb, '管理组绩效_' + getCurrentMonth() + '.xlsx');

  showToast('导出成功：' + data.length + ' 条记录（xlsx格式）');

}



function importData(e) {

  var file = e.target.files[0];

  if (!file) return;

  var ext = file.name.split('.').pop().toLowerCase();

  

  function applyImport(imported) {

    if (!Array.isArray(imported) || imported.length === 0) throw new Error('未解析到有效数据');

    ALL_DATA[getCurrentMonth()] = imported;

    showToast('导入成功：' + imported.length + ' 条记录');

    renderStats();

    switchTab(document.querySelector('.tab-btn.active').dataset.tab);

  }



  if (ext === 'xlsx') {

    var reader = new FileReader();

    reader.onload = function(ev){

      try {

        var wb = XLSX.read(ev.target.result, {type:'array'});

        var sheetName = wb.SheetNames.indexOf('门店使用')>=0 ? '门店使用' : wb.SheetNames[0];

        var ws = wb.Sheets[sheetName];

        var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

        // Find header row (contains '序号')

        var hdrIdx = -1;

        for (var i=0; i<Math.min(rows.length,10); i++) {

          if (rows[i] && rows[i].join('').indexOf('序号')>=0) { hdrIdx = i; break; }

        }

        if (hdrIdx < 0) throw new Error('未找到表头行（需含"序号"列）');

        var hdr = rows[hdrIdx];

        // Map header to keys

        var keyMap = {

          '序号':'rank','区域':'region','门店':'store','负责人':'manager',

          '顾客满意度':'customer_satisfaction','出品管理':'product_quality','报损管理':'loss_control',

          '员工餐管理':'staff_meal','工时管理':'labor_hours','管控动作':'energy_control',

          '核心岗位空缺或超编':'core_position','单个员工工时超上限':'overtime_limit',

          '稽查达标率':'sop_audit','制度知晓情况':'policy_awareness','例会组织':'meeting_org',

          '违纪违规':'violation','营业款存管':'revenue_deposit','营业款入机':'revenue_entry',

          '个人微信代收':'private_wechat','票据管理':'receipt_mgmt',

          '正能量传播':'positive_energy','设备维护台账':'equipment_log',

          '突发事件处理':'emergency','闲置物资返厂':'idle_material',

          '人员招募':'recruitment','带教训练':'training',

          '合计':'total','店管理组级别（new）':'mgmt_level','门店级别':'store_level',

          '店管理组级别（new）90/85/75/65':'mgmt_level_code'

        };

        var mkeys = Object.keys(SCORE_LABELS);

        var colMap = {};

        hdr.forEach(function(h,i){

          var k = (h+'').trim();

          if (keyMap[k]) colMap[i] = keyMap[k];

        });

        var imported = [];

        for (var i=hdrIdx+1; i<rows.length; i++) {

          var row = rows[i];

          if (!row || row.length===0) continue;

          var obj = {};

          var hasStore = false;

          Object.keys(colMap).forEach(function(ci){

            var key = colMap[ci];

            var v = row[ci];

            if (key==='store' && v) hasStore = true;

            if (['rank','total'].concat(mkeys).indexOf(key)>=0) {

              obj[key] = (v!=='' && v!=null) ? parseFloat(v) : null;

            } else {

              obj[key] = v || null;

            }

          });

          if (hasStore) imported.push(obj);

        }

        applyImport(imported);

      } catch(err) {

        showToast('导入失败：' + err.message);

      }

    };

    reader.readAsArrayBuffer(file);

  } else {

    var reader = new FileReader();

    reader.onload = function(ev){

      var text = ev.target.result;

      try {

        if (ext === 'json') {

          var imported = JSON.parse(text);

          if (!Array.isArray(imported)) throw new Error('JSON 需为数组格式');

          applyImport(imported);

        } else if (ext === 'csv') {

          var lines = text.split('\n').filter(function(l){ return l.trim(); });

          if (lines.length < 2) throw new Error('CSV 数据为空');

          var hdr = lines[0].split(',');

          var keyMap = {

            '序号':'rank','区域':'region','门店':'store','负责人':'manager',

            '顾客满意度':'customer_satisfaction','出品管理':'product_quality','报损管理':'loss_control',

            '员工餐管理':'staff_meal','工时管理':'labor_hours','管控动作':'energy_control',

            '核心岗位':'core_position','核心岗位空缺或超编':'core_position',

            '工时上限':'overtime_limit','单个员工工时超上限':'overtime_limit',

            '稽查达标率':'sop_audit','制度知晓':'policy_awareness','制度知晓情况':'policy_awareness',

            '例会组织':'meeting_org','违纪违规':'violation','营业款存管':'revenue_deposit',

            '营业款入机':'revenue_entry','个人微信代收':'private_wechat','票据管理':'receipt_mgmt',

            '正能量传播':'positive_energy','正能量':'positive_energy',

            '设备维护台账':'equipment_log','设备台账':'equipment_log',

            '突发事件处理':'emergency','突发事件':'emergency',

            '闲置物资返厂':'idle_material','闲置物资':'idle_material',

            '人员招募':'recruitment','带教训练':'training',

            '合计':'total','管理组级别':'mgmt_level','店管理组级别':'mgmt_level','门店级别':'store_level'

          };

          var mkeys = Object.keys(SCORE_LABELS);

          var imported = [];

          for (var i=1; i<lines.length; i++) {

            var vals = lines[i].split(',');

            var obj = {};

            for (var j=0; j<hdr.length; j++) {

              var rawKey = hdr[j].replace(/^"|"$/g,'').trim();

              var mapped = keyMap[rawKey];

              if (mapped) {

                var v = (vals[j]||'').replace(/^"|"$/g,'').trim();

                if (['rank','total'].concat(mkeys).indexOf(mapped) >= 0) {

                  obj[mapped] = v ? parseFloat(v) : null;

                } else {

                  obj[mapped] = v;

                }

              }

            }

            if (obj.store) imported.push(obj);

          }

          applyImport(imported);

        }

      } catch(err) {

        showToast('导入失败：' + err.message);

      }

    };

    reader.readAsText(file);

  }

  e.target.value = '';

}



function saveData() {

  var data = { month: document.getElementById('monthSelect').value, stores: ALL_DATA, savedAt: new Date().toISOString() };

  var json = JSON.stringify(data, null, 2);

  var blob = new Blob([json], {type: 'application/json'});

  var url = URL.createObjectURL(blob);

  var a = document.createElement('a');

  a.href = url;

  a.download = '绩效数据备份_' + data.month + '.json';

  a.click();

  URL.revokeObjectURL(url);

  // Also save to localStorage

  try { localStorage.setItem('perf_backup_' + data.month, json); } catch(e){}

  showToast('已保存备份文件');

}



function shareData() {

  var url = window.location.href;

  var text = '门店管理组绩效公示平台 - ' + (document.getElementById('monthSelect').value);

  if (navigator.share) {

    navigator.share({ title: text, url: url }).catch(function(){});

  } else {

    // Copy link

    var ta = document.createElement('textarea');

    ta.value = url;

    document.body.appendChild(ta);

    ta.select();

    document.execCommand('copy');

    document.body.removeChild(ta);

    showToast('链接已复制到剪贴板');

  }

}





function renderAnnual() {

  var allMonths = [];

  for (var m=1; m<=12; m++) { allMonths.push('2026-' + (m<10?'0':'') + m); }

  

  // Aggregate by manager: for each manager, sum scores across all their stores each month, then average

  var mgrMap = {};

  allMonths.forEach(function(month){

    var data = ALL_DATA[month] || [];

    data.forEach(function(d){

      if (!d.store || d.total == null) return;

      var mgr = d.manager||'（未指定）';

      if (!mgrMap[mgr]) mgrMap[mgr] = { manager: mgr, months: {}, stores: {}, regions: {} };

      // Per month: collect all store scores for this manager

      if (!mgrMap[mgr].months[month]) mgrMap[mgr].months[month] = { scores: [], stores: {} };

      mgrMap[mgr].months[month].scores.push(d.total);

      mgrMap[mgr].months[month].stores[d.store] = (mgrMap[mgr].months[month].stores[d.store]||0)+1;

      // Track all stores & regions

      mgrMap[mgr].stores[d.store] = 1;

      mgrMap[mgr].regions[d.region] = 1;

    });

  });



  var mgrs = Object.values(mgrMap);

  mgrs.forEach(function(m){

    m.totalScore = 0; m.totalMonths = 0; m.bestScore = 0; m.bestMonth = '';

    Object.keys(m.months).forEach(function(month){

      var scores = m.months[month].scores;

      var avg = scores.reduce(function(a,b){return a+b;},0) / scores.length;

      m.months[month].avg = avg;

      // Determine level

      if (avg >= 90) m.months[month].level = 'S';

      else if (avg >= 85) m.months[month].level = 'A';

      else if (avg >= 75) m.months[month].level = 'B';

      else if (avg >= 65) m.months[month].level = 'C';

      else m.months[month].level = 'D';

      m.totalScore += avg;

      m.totalMonths++;

      if (avg > m.bestScore) { m.bestScore = avg; m.bestMonth = month; }

    });

    m.avg = m.totalMonths > 0 ? m.totalScore / m.totalMonths : 0;

  });

  mgrs.sort(function(a,b){ return b.avg - a.avg; });



  // Collect all regions for filter

  var regionSet = {};

  mgrs.forEach(function(m){ Object.keys(m.regions).forEach(function(r){ regionSet[r]=1; }); });

  var regionOptions = '<option value="">全部区域</option>';

  Object.keys(regionSet).sort().forEach(function(r){ regionOptions += '<option value="'+r+'">'+r+'</option>'; });



  var dataMonths = allMonths.filter(function(m){ return (ALL_DATA[m]||[]).some(function(d){ return d.total!=null; }); });

  var totalRecords = 0; mgrs.forEach(function(m){ totalRecords += m.totalMonths; });



  var html = '<div class="annual-summary">' +

    '<div class="as-card"><div class="num">'+mgrs.length+'</div><div class="label">负责人总数</div></div>' +

    '<div class="as-card"><div class="num">'+dataMonths.length+'</div><div class="label">已有数据月份</div></div>' +

    '<div class="as-card"><div class="num">'+totalRecords+'</div><div class="label">汇总记录数</div></div>' +

    '</div>';



  html += '<div class="annual-search"><input type="text" id="annualSearchInput" placeholder="搜索负责人…" oninput="filterAnnual()"><select id="annualRegionFilter" onchange="filterAnnual()">'+regionOptions+'</select><span class="as-count" id="annualCount">共 '+mgrs.length+' 人</span></div>';



  html += '<div class="annual-table-wrap"><table class="annual-table" id="annualTable"><thead><tr><th>#</th><th class="col-store">负责人</th><th>管辖区域</th><th>辖店数</th>';

  allMonths.forEach(function(m){

    html += '<th>'+parseInt(m.split('-')[1])+'月</th>';

  });

  html += '<th>均分</th><th>最佳</th><th>记录</th></tr></thead><tbody>';



  mgrs.forEach(function(m, i){

    var isDirect = m.manager==='区域代管' ? ' row-direct' : '';

    var mgrRegions = Object.keys(m.regions).sort().join('、');

    var storeCount = Object.keys(m.stores).length;

    html += '<tr class="'+isDirect+'"><td>'+(i+1)+'</td><td class="col-store">'+m.manager+'</td><td>'+mgrRegions+'</td><td>'+storeCount+'</td>';

    allMonths.forEach(function(month){

      var md = m.months[month];

      if (md) {

        var lc = LEVEL_COLORS[md.level]||LEVEL_COLORS.B;

        var storeNames = Object.keys(md.stores).join('、');

        html += '<td title="'+storeNames+'"><span class="cell-month-lv" style="background:'+lc.bg+';color:'+lc.color+'">'+md.level+'</span><br><span class="cell-month-score">'+md.avg.toFixed(1)+'</span></td>';

      } else {

        html += '<td class="month-na">—</td>';

      }

    });

    html += '<td><span class="cell-avg">'+m.avg.toFixed(1)+'</span></td>';

    html += '<td><span class="cell-best">'+m.bestScore.toFixed(1)+'<br><span style="font-size:10px;color:#999">'+(m.bestMonth||'').replace('2026-','')+'月</span></span></td>';

    html += '<td>'+m.totalMonths+'/12</td></tr>';

  });

  html += '</tbody></table></div>';

  return html;

}



function filterAnnual() {

  var q = (document.getElementById('annualSearchInput').value||'').trim().toLowerCase();

  var rf = document.getElementById('annualRegionFilter').value;

  var rows = document.querySelectorAll('#annualTable tbody tr');

  var count = 0;

  rows.forEach(function(row){

    var txt = row.textContent.toLowerCase();

    var cells = row.querySelectorAll('td');

    var regionText = cells.length>=3 ? cells[2].textContent : '';

    var matchText = !q || txt.indexOf(q)>=0;

    var matchRegion = !rf || regionText.indexOf(rf)>=0;

    if (matchText && matchRegion) { row.style.display=''; count++; }

    else { row.style.display='none'; }

  });

  document.getElementById('annualCount').textContent = '显示 '+count+' 人';

}



function switchTab(tab) {

  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });

  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');

  var c = document.getElementById('content');

  if (tab==='ranking') c.innerHTML = renderRanking();

  else if (tab==='region') c.innerHTML = renderRegion();

  else if (tab==='person') { c.innerHTML = renderPerson(); document.getElementById('personCount').textContent = '共 '+(getValid().length)+' 家'; }

  else if (tab==='annual') c.innerHTML = renderAnnual();

}



document.addEventListener('DOMContentLoaded', function(){

  renderStats();

  document.getElementById('content').innerHTML = renderRanking();

  document.querySelectorAll('.tab-btn').forEach(function(btn){

    btn.addEventListener('click', function(){ switchTab(this.dataset.tab); });

  });

});



</script>
